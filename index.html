<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelLens 旅遊視覺資產管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        @keyframes scan { 0% { transform: translateY(0); } 100% { transform: translateY(120px); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.95); } 100% { opacity: 1; transform: scale(1); } }
        
        .animate-fadeIn { animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-popIn { animation: popIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .scan-line { animation: scan 1.5s ease-in-out infinite alternate; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased selection:bg-blue-200 selection:text-blue-900">

    <div id="login-screen" class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/40 backdrop-blur-lg transition-opacity duration-500 px-4">
        <div class="bg-white/90 backdrop-blur-xl rounded-3xl p-8 w-full max-w-sm shadow-2xl transform transition-all animate-popIn text-center border border-white/40">
            <div class="h-24 flex items-center justify-center mx-auto mb-4 transform hover:scale-105 transition-transform">
                <img src="image_baefbd.png" alt="TravelLens Logo" class="h-full object-contain drop-shadow-sm" onerror="this.src='https://placehold.co/200x80/ffffff/333333?text=TravelLens'" />
            </div>
            <h2 class="text-3xl font-extrabold tracking-tight text-slate-900 mb-2">TravelLens</h2>
            <p class="text-sm text-slate-500 mb-8 font-medium">旅遊視覺資產管理系統</p>
            <form onsubmit="window.handleLogin(event)">
                <div class="space-y-4 mb-6">
                    <input type="email" id="email-input" placeholder="登入信箱 (Email)" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:bg-white outline-none transition-all text-center tracking-wider font-medium placeholder-slate-400 shadow-sm" required autofocus />
                    <input type="password" id="password-input" placeholder="密碼 (Password)" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:bg-white outline-none transition-all text-center tracking-widest font-medium placeholder-slate-400 shadow-sm" required />
                </div>
                <p id="login-error" class="text-red-500 text-xs mb-4 font-semibold bg-red-50 py-2 rounded-lg hidden">帳號或密碼錯誤，請再試一次</p>
                <button type="submit" id="login-btn" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-xl px-4 py-3.5 font-bold hover:from-blue-700 hover:to-indigo-700 transition-all shadow-lg hover:shadow-blue-500/30 flex justify-center items-center gap-2 transform active:scale-[0.98]">
                    進入系統 <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </form>
        </div>
    </div>

    <div class="flex flex-col md:flex-row h-screen relative hidden overflow-hidden" id="app">
        <aside class="w-full md:w-72 bg-white border-r border-slate-200 flex flex-col h-full shrink-0 z-20 shadow-[4px_0_24px_-12px_rgba(0,0,0,0.1)] relative">
            <div class="p-6 border-b border-slate-100 shrink-0 bg-white/80 backdrop-blur-md">
                <div class="flex items-center gap-3 mb-1">
                    <img src="image_baefbd.png" alt="Logo" class="h-8 w-auto object-contain" onerror="this.style.display='none'" />
                    <h1 class="text-2xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-600">
                        TravelLens
                    </h1>
                </div>
                <div id="auth-status" class="mt-2 text-[11px] font-semibold tracking-wider"></div>
            </div>
            
            <div class="p-5 flex-1 overflow-y-auto custom-scrollbar">
                <div class="relative mb-8 group">
                    <input type="text" id="searchInput" placeholder="搜尋關鍵字..." class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 outline-none transition-all font-medium placeholder-slate-400 group-hover:border-blue-300" />
                    <i data-lucide="search" class="absolute left-3.5 top-3 text-slate-400 w-4 h-4 group-hover:text-blue-500 transition-colors"></i>
                </div>
                <div id="filters-container" class="space-y-6"></div>
            </div>
        </aside>

        <main class="w-full md:flex-1 flex flex-col h-full z-10 bg-slate-50/50 shrink-0 min-w-0">
            <header class="h-16 bg-white/70 backdrop-blur-lg border-b border-slate-200 flex items-center justify-between px-6 shrink-0 z-20 shadow-sm sticky top-0">
                <div id="gallery-stats" class="flex items-center gap-2 text-sm font-semibold text-slate-500 bg-white px-3 py-1.5 rounded-lg border border-slate-200 shadow-sm"></div>
                <div id="header-actions" class="flex items-center gap-3"></div>
            </header>
            <div id="gallery-container" class="flex-1 overflow-y-auto p-6 custom-scrollbar relative"></div>
        </main>

        <aside class="w-full md:w-80 bg-white border-l border-slate-200 flex flex-col h-full z-20 shadow-[-4px_0_24px_-12px_rgba(0,0,0,0.1)] shrink-0">
            <div class="p-6 border-b border-slate-100 bg-white shrink-0">
                <h2 class="text-lg font-bold text-slate-900 flex items-center justify-between mb-4">
                    專案排版夾
                    <span id="moodboard-count" class="bg-blue-50 text-blue-700 text-xs font-bold py-1 px-2.5 rounded-lg border border-blue-100">0 張</span>
                </h2>
                <div class="flex gap-3" id="project-export-settings"></div>
            </div>
            
            <div id="moodboard-items" class="flex-1 overflow-y-auto p-5 space-y-4 custom-scrollbar bg-slate-50/30"></div>
            
            <div class="p-5 border-t border-slate-100 bg-white shrink-0">
                <button id="exportBtn" onclick="window.handleExport()" disabled class="w-full py-3 rounded-xl text-sm font-bold transition-all bg-slate-100 text-slate-400 cursor-not-allowed">
                    打包下載 (ZIP)
                </button>
            </div>
        </aside>
    </div>

    <!-- Modals Container -->
    <div id="toast-container" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[200] transition-all duration-300 transform translate-y-20 opacity-0 pointer-events-none flex items-center gap-4 bg-slate-900/95 backdrop-blur-md text-white px-5 py-3.5 rounded-2xl shadow-2xl shadow-slate-900/20 border border-slate-700">
        <i data-lucide="info" class="w-5 h-5 text-blue-400 shrink-0"></i>
        <span id="toast-message" class="text-sm font-bold tracking-wide whitespace-nowrap"></span>
        <div id="toast-action-container" class="border-l border-slate-700 pl-4 ml-1">
            <button id="toast-action-btn" class="text-sm font-extrabold text-blue-400 hover:text-blue-300 transition-colors uppercase tracking-widest pointer-events-auto active:scale-95 transform whitespace-nowrap"></button>
        </div>
    </div>
    <div id="modals-container"></div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, onSnapshot, doc, setDoc, getDoc, getDocs, query, orderBy, runTransaction, limit, deleteDoc } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';
        import { getStorage, ref, uploadString, getDownloadURL } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js';

        const firebaseConfig = {
            apiKey: "AIzaSyAfB6THM5bJNd5wsBwpabMCkEak80xcMrc",
            authDomain: "photo-ed222.firebaseapp.com",
            projectId: "photo-ed222",
            storageBucket: "photo-ed222.firebasestorage.app", 
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = initializeFirestore(app, {
            localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
        });
        const storage = getStorage(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'travel-lens-prod';

        const state = {
            user: null, 
            photos: [], 
            displayLimit: 30,
            categories: {
                content: ['景點','娛樂','餐飲','住宿','交通','自然','人文'], 
                yearHierarchy: { '2026': ['日文刊', '韓文刊', '繁中刊'], '2027': [], '2028': [] },
                issue: ['Vol.12', 'Vol.13', 'Vol.14'],
                remarks: ['空拍', '夜景', '人像', '特殊企劃'], 
                locationHierarchy: {
                    '台灣-花蓮': ['花蓮市', '吉安鄉', '秀林鄉'], '台灣-墾丁': ['恆春鎮'], '日本-東京': ['新宿區', '澀谷區'], '日本-北海道': [], '法國-巴黎': []
                }
            },
            searchQuery: '',
            filters: { content: [], year: [], yearEdition: [], issue: [], remarks: [], locationCity: [], locationDist: [] }, 
            moodBoard: [],
            isSelectionMode: false,
            selectedIds: new Set(),
            isLoading: true,
            isBatchModalOpen: false,
            batchStatus: 'idle',
            uploadBatch: [],
            tagModal: { isOpen: false, type: '', error: '', parentCity: '' },
            confirmDialog: { isOpen: false, message: '', action: null, isLoading: false },
            editModal: { isOpen: false, photo: null },
            bulkEdit: { isOpen: false, data: { content: null, year: null, yearEdition: null, issue: null, remarks: null, locationCity: null, locationDist: null } }
        };

        let unsubTags = null;
        let loadMoreObserver = null;
        let searchTimeout = null;

        // Toast 復原機制狀態
        let toastTimeoutId = null;
        let toastFinalAction = null;

        window.showToast = (message, actionText, onUndo, onFinalize, duration = 6000) => {
            const container = document.getElementById('toast-container');
            const msgEl = document.getElementById('toast-message');
            const btn = document.getElementById('toast-action-btn');
            const actionContainer = document.getElementById('toast-action-container');

            // 如果還有上一個未執行的終局操作，立刻執行
            if (toastFinalAction) { toastFinalAction(); toastFinalAction = null; }
            clearTimeout(toastTimeoutId);

            msgEl.textContent = message;
            if (actionText && onUndo) {
                actionContainer.classList.remove('hidden');
                btn.textContent = actionText;
                btn.onclick = () => {
                    clearTimeout(toastTimeoutId); toastFinalAction = null; onUndo(); window.hideToast();
                };
            } else { actionContainer.classList.add('hidden'); }

            toastFinalAction = onFinalize;
            container.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
            container.classList.add('translate-y-0', 'opacity-100');

            // 倒數結束執行真正刪除
            toastTimeoutId = setTimeout(() => {
                if (toastFinalAction) { toastFinalAction(); toastFinalAction = null; }
                window.hideToast();
            }, duration);
        };

        window.hideToast = () => {
            const container = document.getElementById('toast-container');
            container.classList.remove('translate-y-0', 'opacity-100');
            container.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
        };

        function updateGallery() { renderGallery(); }
        function updateMoodBoard() { renderMoodBoard(); }

        window.handleLogin = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email-input').value;
            const pwd = document.getElementById('password-input').value;
            const btn = document.getElementById('login-btn');
            const errorEl = document.getElementById('login-error');
            
            btn.disabled = true;
            btn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> 驗證中...';
            errorEl.classList.add('hidden');
            lucide.createIcons();

            try {
                const userCred = await signInWithEmailAndPassword(auth, email, pwd);
                localStorage.setItem('travelLensUid', userCred.user.uid);
                document.getElementById('login-screen').classList.add('hidden'); 
                document.getElementById('app').classList.remove('hidden');
                initApp(); 
            } catch (error) {
                errorEl.innerText = '帳號或密碼錯誤，請檢查後再試一次';
                errorEl.classList.remove('hidden');
                document.getElementById('password-input').value = ''; document.getElementById('password-input').focus();
                btn.disabled = false; btn.innerHTML = '進入系統 <i data-lucide="arrow-right" class="w-4 h-4"></i>';
                lucide.createIcons();
            }
        };

        async function initApp() {
            state.user = { uid: auth.currentUser?.uid || localStorage.getItem('travelLensUid'), role: 'uploader' }; 
            renderAuthStatus();
            
            try {
                const roleRef = doc(db, 'artifacts', appId, 'public', 'data', 'user_roles', state.user.uid);
                const roleSnap = await getDoc(roleRef);
                if (roleSnap.exists()) {
                    // 更新：移除 downloader 角色
                    state.user.role = roleSnap.data().role || 'uploader'; // admin, senior_editor, editor, or uploader
                }
                renderAuthStatus();

                const tagsRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'tags_v2');
                unsubTags = onSnapshot(tagsRef, (docSnap) => {
                    if (docSnap.exists()) { 
                        const data = docSnap.data();
                        if (data.year && Array.isArray(data.year) && !data.yearHierarchy) {
                            data.yearHierarchy = {}; data.year.forEach(y => data.yearHierarchy[y] = []); delete data.year;
                        }
                        state.categories = { ...state.categories, ...data }; 
                        if (!state.categories.remarks) state.categories.remarks = [];
                        updateFilters(); updateModals(); 
                    }
                });
                
                window.loadPhotos();
            } catch (err) { console.error("Init Error:", err); }
        }

        window.loadPhotos = async () => {
            if (!state.user) return;
            state.isLoading = true;
            updateGallery();

            try {
                let batchPhotos = []; let legacyPhotos = [];
                const batchRef = collection(db, 'artifacts', appId, 'public', 'data', 'photo_batches');
                const batchSnap = await getDocs(batchRef);
                batchSnap.forEach(docSnap => {
                    const data = docSnap.data();
                    if (data.items && Array.isArray(data.items)) {
                        data.items.forEach(item => batchPhotos.push({ ...item, batchId: docSnap.id, _isBatch: true }));
                    }
                });

                const legacyRef = collection(db, 'artifacts', appId, 'public', 'data', 'photos');
                const oldSnap = await getDocs(legacyRef);
                oldSnap.forEach(docSnap => legacyPhotos.push({ id: docSnap.id, ...docSnap.data(), _isBatch: false }));

                state.photos = [...batchPhotos, ...legacyPhotos].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

            } catch (error) {
                console.error("Load photos error:", error);
                const container = document.getElementById('gallery-container');
                if (container) {
                    container.innerHTML = `<div class="h-full flex flex-col items-center justify-center text-rose-500 py-10 animate-fadeIn"><i data-lucide="shield-alert" class="w-12 h-12 mb-4"></i><p class="font-bold">讀取圖庫失敗</p><p class="text-xs mt-2 opacity-80">${error.message}</p></div>`;
                    lucide.createIcons({ root: container });
                }
            } finally {
                state.isLoading = false;
                updateGallery();
                updateMoodBoard();
            }
        };

        function renderAuthStatus() {
            const el = document.getElementById('auth-status'); 
            // 更新：移除 downloader 對應名稱
            const roleMap = { 'admin': '管理員', 'senior_editor': '資深編輯', 'editor': '編輯', 'uploader': '上傳者' };
            const roleName = state.user ? roleMap[state.user.role] : '';

            if (state.user) el.innerHTML = `<span class="flex items-center text-emerald-600 uppercase"><div class="w-1.5 h-1.5 bg-emerald-500 rounded-full mr-1.5 animate-pulse"></div> 雲端連線中 (${roleName})</span>`;
            else el.innerHTML = `<span class="flex items-center text-rose-500 uppercase"><div class="w-1.5 h-1.5 bg-rose-500 rounded-full mr-1.5"></div> 連線中...</span>`;
        }

        function updateFilters() {
            const detailsStates = {};
            document.querySelectorAll('details.loc-group').forEach(el => {
                if (el.dataset.city) detailsStates['loc_'+el.dataset.city] = el.open;
                if (el.dataset.year) detailsStates['year_'+el.dataset.year] = el.open;
            });
            const container = document.getElementById('filters-container');
            if(!container) return;
            const scrollTop = container.scrollTop;

            let html = '';
            html += renderFilterSection('content', '內容與體驗', 'bookmark', 'blue', state.categories.content);
            html += renderFilterSection('issue', '雜誌期數', 'book-open', 'violet', state.categories.issue);
            html += renderFilterSection('remarks', '相關備註', 'tag', 'amber', state.categories.remarks || []);
            
            // 年份與語系 (巢狀)
            html += `
            <div class="mb-2">
                <h3 class="text-[11px] font-bold tracking-widest text-slate-400 mb-3 flex items-center justify-between uppercase">
                    <div class="flex items-center gap-1.5"><i data-lucide="calendar" class="w-3.5 h-3.5"></i> 發行年份與刊物</div>
                    ${state.user?.role === 'admin' || state.user?.role === 'senior_editor' ? `<button onclick="window.openAddTagModal('year')" class="text-slate-400 hover:text-indigo-600 bg-slate-100 hover:bg-indigo-50 p-1 rounded-md transition-colors" title="新增年份"><i data-lucide="plus" class="w-3 h-3"></i></button>` : ''}
                </h3>
            `;
            
            Object.keys(state.categories.yearHierarchy || {}).forEach(year => {
                const editions = state.categories.yearHierarchy[year] || [];
                const isYearChecked = state.filters.year.includes(year);
                const isOpen = detailsStates['year_'+year] ? 'open' : '';
                
                html += `
                <details class="loc-group mb-1 group/details" data-year="${year}" ${isOpen}>
                    <summary class="flex items-center justify-between cursor-pointer py-1.5 px-2 hover:bg-slate-100/70 rounded-lg select-none transition-colors">
                        <div class="flex items-center gap-2 flex-1 min-w-0">
                            <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-slate-400 transition-transform group-open/details:rotate-90 shrink-0"></i>
                            <label class="flex items-center space-x-2.5 cursor-pointer flex-1 min-w-0" onclick="event.stopPropagation(); window.toggleFilter('year', '${year}')">
                                <div class="w-4 h-4 rounded border flex items-center justify-center transition-all duration-200 shrink-0 ${isYearChecked ? 'bg-indigo-500 border-indigo-500 shadow-sm shadow-indigo-500/20' : 'border-slate-300 hover:border-indigo-400 bg-white'}">
                                    ${isYearChecked ? '<i data-lucide="check" class="text-white w-3 h-3"></i>' : ''}
                                </div>
                                <span class="text-sm font-semibold truncate ${isYearChecked ? 'text-slate-900' : 'text-slate-600'}">${year}</span>
                            </label>
                        </div>
                        <div class="flex items-center gap-1 opacity-0 group-hover/details:opacity-100 shrink-0">
                            ${state.user?.role === 'admin' || state.user?.role === 'senior_editor' ? `<button onclick="event.preventDefault(); window.openAddTagModal('yearEdition', '${year}')" class="text-slate-400 hover:text-indigo-600 p-1 rounded hover:bg-indigo-50" title="在此新增語系/刊物"><i data-lucide="plus" class="w-3.5 h-3.5"></i></button>` : ''}
                            ${state.user?.role === 'admin' ? `<button onclick="event.preventDefault(); window.handleDeleteTag('year', '${year}')" class="text-slate-400 hover:text-rose-500 p-1 rounded hover:bg-rose-50" title="刪除"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>` : ''}
                        </div>
                    </summary>
                    <div class="pl-8 mt-1 space-y-1 mb-3 relative before:absolute before:left-4 before:top-0 before:bottom-2 before:w-px before:bg-slate-200">
                `;
                
                if (editions.length === 0) {
                    html += `<p class="text-[11px] text-slate-400 font-medium py-1">無子項目</p>`;
                } else {
                    editions.forEach(ed => {
                        const isEdChecked = state.filters.yearEdition.includes(`${year}|${ed}`);
                        html += `
                        <div class="flex items-center justify-between group py-1 pr-2">
                            <label class="flex items-center space-x-2.5 cursor-pointer flex-1 min-w-0" onclick="event.preventDefault(); window.toggleFilter('yearEdition', '${year}|${ed}')">
                                <div class="w-3.5 h-3.5 rounded border flex items-center justify-center transition-all duration-200 shrink-0 ${isEdChecked ? 'bg-indigo-500 border-indigo-500 shadow-sm' : 'border-slate-300 hover:border-indigo-400 bg-white'}">
                                    ${isEdChecked ? '<i data-lucide="check" class="text-white w-2.5 h-2.5"></i>' : ''}
                                </div>
                                <span class="text-sm font-medium truncate ${isEdChecked ? 'text-slate-900' : 'text-slate-500'}">${ed}</span>
                            </label>
                            ${state.user?.role === 'admin' ? `<button onclick="window.handleDeleteTag('yearEdition', '${year}|${ed}', event)" class="text-slate-300 hover:text-rose-500 opacity-0 group-hover:opacity-100 p-1 rounded hover:bg-rose-50"><i data-lucide="x" class="w-3 h-3"></i></button>` : ''}
                        </div>`;
                    });
                }
                html += `</div></details>`;
            });
            html += `</div>`;

            // 地理位置
            html += `
            <div class="mb-2">
                <h3 class="text-[11px] font-bold tracking-widest text-slate-400 mb-3 flex items-center justify-between uppercase">
                    <div class="flex items-center gap-1.5"><i data-lucide="map-pin" class="w-3.5 h-3.5"></i> 地理位置</div>
                    ${state.user?.role === 'admin' || state.user?.role === 'senior_editor' ? `<button onclick="window.openAddTagModal('locationCity')" class="text-slate-400 hover:text-emerald-600 bg-slate-100 hover:bg-emerald-50 p-1 rounded-md transition-colors" title="新增國家/縣市"><i data-lucide="plus" class="w-3 h-3"></i></button>` : ''}
                </h3>
            `;
            
            Object.keys(state.categories.locationHierarchy).forEach(city => {
                const dists = state.categories.locationHierarchy[city];
                const isCityChecked = state.filters.locationCity.includes(city);
                const isOpen = detailsStates['loc_'+city] ? 'open' : '';
                
                html += `
                <details class="loc-group mb-1 group/details" data-city="${city}" ${isOpen}>
                    <summary class="flex items-center justify-between cursor-pointer py-1.5 px-2 hover:bg-slate-100/70 rounded-lg select-none transition-colors">
                        <div class="flex items-center gap-2 flex-1 min-w-0">

        window.toggleMoodBoard = (photoId, event) => {

            if (!photo) return;

            const index = state.moodBoard.findIndex(p => p.id === photoId);

            if (index > -1) { state.moodBoard.splice(index, 1); } else { state.moodBoard.push(photo); isNowSelected = true; }

                    btn.className = 'absolute top-3 right-3 p-2.5 rounded-full shadow-lg z-30 bg-blue-600 text-white hover:bg-blue-700 transition-all transform hover:scale-110';

                    btn.className = 'absolute top-3 right-3 p-2.5 rounded-full shadow-lg z-30 bg-white/90 backdrop-blur text-slate-700 hover:bg-white transition-all transform hover:scale-110';

        function renderGallery() {

            const container = document.getElementById('gallery-container');

                const searchTxt = state.searchQuery.toLowerCase();

                    matchYear = yMatch || edMatch;

                let matchLocation = true;
                if (state.filters.locationCity.length > 0 || state.filters.locationDist.length > 0) {
                    const cityMatch = state.filters.locationCity.includes(photo.locationCity);
                    const distMatch = state.filters.locationDist.includes(`${photo.locationCity}|${photo.locationDist}`);
                    matchLocation = cityMatch || distMatch;
                }
                return matchSearch && matchContent && matchYear && matchIssue && matchRemarks && matchLocation;

            if (state.isLoading) {
                container.innerHTML = `<div class="h-full flex flex-col items-center justify-center text-slate-400 animate-fadeIn"><i data-lucide="loader-2" class="animate-spin mb-4 text-blue-500 w-10 h-10"></i><p class="font-bold">載入圖庫中...</p></div>`; return;
            }
            if (state.photos.length === 0) {
                container.innerHTML = `<div class="h-full flex flex-col items-center justify-center text-slate-400 py-10 animate-fadeIn"><div class="w-20 h-20 bg-slate-100 rounded-full flex items-center justify-center mb-4"><i data-lucide="image" class="w-10 h-10 text-slate-300"></i></div><p class="mb-2 font-bold text-slate-600">圖庫目前是空的</p><p class="text-sm">點擊右上角批量上傳開始匯入</p></div>`; return;
            }
            if (filteredPhotos.length === 0) {
                 container.innerHTML = `<div class="h-full flex flex-col items-center justify-center text-slate-400 py-10 animate-fadeIn"><i data-lucide="filter-x" class="w-12 h-12 mb-4 text-slate-300"></i><p class="font-bold text-slate-600">沒有符合條件的照片</p></div>`; return;
            }

            const photosToRender = filteredPhotos.slice(0, state.displayLimit);
            let html = `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 pb-10">`;
            
            photosToRender.forEach(photo => {
                const inMoodboard = state.moodBoard.some(p => p.id === photo.id);
                const isSelected = state.selectedIds.has(photo.id);
                const locDisplay = [photo.locationCity, photo.locationDist].filter(Boolean).join(', ');
                const yearDisplay = [photo.year, photo.yearEdition].filter(Boolean).join(' | ');
                
                const contentTags = Array.isArray(photo.content) ? photo.content : (photo.content ? [photo.content] : []);
                const contentDisplay = contentTags.map(c => `<span class="flex items-center gap-1 bg-slate-100 px-2 py-1 rounded text-slate-600"><i data-lucide="bookmark" class="w-3 h-3"></i> ${c}</span>`).join('');
                
                const cardBaseClass = "group relative bg-white rounded-2xl overflow-hidden transition-all duration-300 flex flex-col cursor-pointer";
                const cardActiveStyle = isSelected ? "ring-4 ring-blue-500 shadow-xl scale-[0.98]" : "border border-slate-200 hover:shadow-xl";
                
                html += `
                    <div class="${cardBaseClass} ${cardActiveStyle}" onclick="window.handlePhotoClick('${photo.id}')" id="card-${photo.id}">
                        <div id="sel-icon-${photo.id}" class="${isSelected ? 'absolute inset-0 bg-blue-500/10 border-[6px] border-blue-500 rounded-2xl z-20 flex items-start justify-start p-3 transition-all' : 'hidden'}">
                            <div class="bg-blue-500 text-white rounded-full p-1 shadow-md"><i data-lucide="check" class="w-5 h-5"></i></div>
                        </div>

                        <div class="relative aspect-[4/3] bg-slate-200 overflow-hidden shrink-0">
                            <!-- 更新：加入禁用右鍵與拖曳的屬性 -->
                            <img src="${photo.url}" loading="lazy" alt="${photo.title}" oncontextmenu="return false;" draggable="false" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105 pointer-events-none select-none" />
                            <div class="absolute inset-0 bg-gradient-to-t from-slate-900/60 via-transparent to-transparent pointer-events-none z-10"></div>
                            
                            ${!state.isSelectionMode ? `
                                <button id="mb-btn-${photo.id}" onclick="window.toggleMoodBoard('${photo.id}', event)" class="absolute top-3 right-3 p-2.5 rounded-full shadow-lg z-30 transition-all transform hover:scale-110 ${inMoodboard ? 'bg-blue-600 text-white' : 'bg-white/90 backdrop-blur text-slate-700 hover:bg-white'}">
                                    <i data-lucide="${inMoodboard ? 'check' : 'plus'}" class="w-4 h-4"></i>
                                </button>
                                ${state.user?.role === 'admin' || state.user?.role === 'senior_editor' || state.user?.role === 'editor' ? `
                                <button onclick="window.handlePhotoClick('${photo.id}')" class="absolute top-3 left-3 p-2.5 rounded-full bg-slate-900/60 text-white shadow-lg backdrop-blur opacity-0 group-hover:opacity-100 z-30 transition-all hover:bg-slate-900 transform hover:scale-110">
                                    <i data-lucide="pencil" class="w-4 h-4"></i>
                                </button>
                                ` : ''}
                            ` : ''}

                            <div class="absolute bottom-3 left-3 flex gap-1.5 z-20">
                                ${yearDisplay ? `<span class="px-2 py-1 text-[10px] font-bold tracking-wider uppercase bg-white/20 backdrop-blur-md text-white rounded shadow-sm flex items-center gap-1 border border-white/20"><i data-lucide="calendar" class="w-3 h-3"></i> ${yearDisplay} ${photo.issue ? '| ' + photo.issue : ''}</span>` : ''}
                            </div>

                        <div class="p-4 flex-1 flex flex-col bg-white z-10 relative">
                            <h4 class="font-bold text-slate-900 mb-2 truncate text-sm" title="${photo.title}">${photo.customText || photo.title || '未命名'}</h4>
                            <div class="flex flex-wrap gap-1.5 text-[10px] font-semibold text-slate-500 mt-auto">
                                ${contentDisplay}
                                ${locDisplay ? `<span class="flex items-center gap-1 bg-emerald-50 text-emerald-700 px-2 py-1 rounded border border-emerald-100"><i data-lucide="map-pin" class="w-3 h-3"></i> ${locDisplay}</span>` : ''}
                                ${photo.remarks ? `<span class="flex items-center gap-1 bg-amber-50 text-amber-700 px-2 py-1 rounded border border-amber-100"><i data-lucide="tag" class="w-3 h-3"></i> ${photo.remarks}</span>` : ''}

        function setupScrollObserver() {
            if (loadMoreObserver) loadMoreObserver.disconnect();
            const sentinel = document.getElementById('load-more-sentinel');
            if (!sentinel) return;

            loadMoreObserver = new IntersectionObserver((entries) => {
                if (entries[0].isIntersecting) { state.displayLimit += 30; updateGallery(); }
            }, { root: document.getElementById('gallery-container'), rootMargin: '200px' });
            loadMoreObserver.observe(sentinel);
        }

        document.getElementById('searchInput').addEventListener('input', (e) => { 
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                state.searchQuery = e.target.value; state.displayLimit = 30; 
                document.getElementById('gallery-container').scrollTop = 0; updateGallery(); 
            }, 250);
        });

        window.toggleFilter = (type, value) => {
            const current = state.filters[type];
            if (current.includes(value)) state.filters[type] = current.filter(item => item !== value);
            else state.filters[type].push(value);
            state.displayLimit = 30; document.getElementById('gallery-container').scrollTop = 0;
            updateFilters(); updateGallery();
        };
        
        window.clearFilters = () => {
            state.filters = { content: [], year: [], yearEdition: [], issue: [], remarks: [], locationCity: [], locationDist: [] };
            state.searchQuery = ''; document.getElementById('searchInput').value = '';
            state.displayLimit = 30; document.getElementById('gallery-container').scrollTop = 0;
            updateFilters(); updateGallery();
        };

        window.handleBatchDelete = () => {
            if (state.selectedIds.size === 0) return;
            if (state.user?.role !== 'admin') { alert("權限不足：只有管理員可以刪除照片。"); return; }

            state.confirmDialog = {
                isOpen: true, 
                message: `確定要刪除這 ${state.selectedIds.size} 張照片嗎？\n(系統將提供 6 秒的「復原」時間，超時將永久刪除)`, 
                isPrimary: false,
                action: () => {
                    const idsToDelete = Array.from(state.selectedIds);
                    const photosToDelete = state.photos.filter(p => idsToDelete.includes(p.id));
                    const moodboardToDelete = state.moodBoard.filter(p => idsToDelete.includes(p.id));

                    // 1. 視覺上先移除，營造即時感
                    state.photos = state.photos.filter(p => !idsToDelete.includes(p.id));
                    state.moodBoard = state.moodBoard.filter(p => !idsToDelete.includes(p.id));
                    state.selectedIds.clear();
                    state.isSelectionMode = false;
                    
                    window.closeConfirmDialog();
                    updateGallery(); 
                    updateMoodBoard(); 
                    
                    // 2. 顯示 Toast 與復原按鈕
                    window.showToast(`已刪除 ${idsToDelete.length} 張照片`, '復原', () => {
                        // 點擊復原：把照片加回來
                        state.photos = [...photosToDelete, ...state.photos].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                        state.moodBoard = [...state.moodBoard, ...moodboardToDelete];
                        updateGallery(); 
                        updateMoodBoard();
                    }, async () => {
                        // 倒數結束：真正執行 Firestore 的刪除
                        try {
                            const legacyIds = [];
                            const batchGroups = {}; 
                            
                            photosToDelete.forEach(photo => {
                                if (photo._isBatch) {
                                    if (!batchGroups[photo.batchId]) batchGroups[photo.batchId] = [];
                                    batchGroups[photo.batchId].push(photo.id);
                                } else {
                                    legacyIds.push(photo.id);
                                }
                            });

                            const promises = [];
                            legacyIds.forEach(id => { promises.push(deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'photos', id))); });
                            Object.keys(batchGroups).forEach(batchId => {
                                const idsToRemove = batchGroups[batchId];
                                const batchRef = doc(db, 'artifacts', appId, 'public', 'data', 'photo_batches', batchId);
                                promises.push(runTransaction(db, async (transaction) => {
                                    const batchDoc = await transaction.get(batchRef);
                                    if (batchDoc.exists()) {
                                        const items = batchDoc.data().items || [];
                                        const newItems = items.filter(i => !idsToRemove.includes(i.id));
                                        if (newItems.length === 0) transaction.delete(batchRef);
                                        else transaction.update(batchRef, { items: newItems });
                                    }
                                }));
                            });

                            await Promise.all(promises);
                        } catch (error) {
                            console.error("Batch delete error:", error);
                            alert("背景刪除過程中發生錯誤");
                        }
                    });
                }
            };
            updateModals();
        };

        function renderMoodBoard() {
            const container = document.getElementById('moodboard-items');
            const countEl = document.getElementById('moodboard-count');
            const btn = document.getElementById('exportBtn');
            const settingsContainer = document.getElementById('project-export-settings');

            const currentYear = document.getElementById('project-year')?.value || '';
            const currentIssue = document.getElementById('project-issue')?.value || '';

            // 更新下載權限判斷：admin 和 senior_editor 可以下載
            const canDownload = state.user?.role === 'admin' || state.user?.role === 'senior_editor';

            settingsContainer.innerHTML = `

        window.handleExport = () => {
            // 更新防呆保護：檢查 admin 和 senior_editor 的下載權限
            if (state.user?.role !== 'admin' && state.user?.role !== 'senior_editor') {
                alert("權限不足：您沒有下載原檔的權限，請聯絡管理員。"); return;
            }
            if (state.moodBoard.length === 0) return;
            const year = document.getElementById('project-year').value || '未定年份';
            const issue = document.getElementById('project-issue').value || '未定期數';
            const zipName = `TravelLens_資源_${year}_${issue}.zip`;

            state.confirmDialog = {
                isOpen: true, message: `確認將企劃板下載為：\n${zipName} 嗎？`, isPrimary: true,
                action: async () => {
                    window.closeConfirmDialog();
                    const exportBtn = document.getElementById('exportBtn'); const origText = exportBtn.innerText;
                    exportBtn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin inline mr-2"></i> 打包壓縮中...'; exportBtn.disabled = true;
                    try {
                        const zip = new JSZip();
                        await Promise.all(state.moodBoard.map(async (photo, index) => {
                            try {
                                const response = await fetch(photo.url); const blob = await response.blob();
                                const ext = blob.type.split('/')[1] || 'jpg';
                                const safeTitle = (photo.customText || photo.title || '圖片').replace(/[^a-zA-Z0-9\u4e00-\u9fa5_-]/g, '');
                                zip.file(`${String(index + 1).padStart(3, '0')}_${safeTitle}.${ext}`, blob);
                            } catch (err) { zip.file(`Error_${index + 1}.txt`, `下載阻擋:\n${photo.url}`); }
                        }));
                        const zipBlob = await zip.generateAsync({ type: 'blob' });
                        const link = document.createElement('a'); link.href = URL.createObjectURL(zipBlob); link.download = zipName;
                        document.body.appendChild(link); link.click(); document.body.removeChild(link); URL.revokeObjectURL(link.href);
                        state.moodBoard = []; updateGallery(); updateMoodBoard();
                    } catch (error) { alert('下載發生錯誤'); } 
                    finally { exportBtn.innerText = origText; exportBtn.disabled = false; }
                }
            }; updateModals();
        };

        function updateModals() {
            const batchModal = document.getElementById('batch-modal-content');
            const editModal = document.getElementById('edit-modal-content');
            const bulkModal = document.getElementById('bulk-edit-content');
            const batchScrollTop = batchModal ? batchModal.scrollTop : 0;
            const editScrollTop = editModal ? editModal.scrollTop : 0;
            const bulkScrollTop = bulkModal ? bulkModal.scrollTop : 0;
            
            renderModals(); lucide.createIcons();
            
            requestAnimationFrame(() => {
                const newB = document.getElementById('batch-modal-content'); const newE = document.getElementById('edit-modal-content'); const newBulk = document.getElementById('bulk-edit-content');
                if (newB && batchScrollTop > 0) newB.scrollTop = batchScrollTop;
                if (newE && editScrollTop > 0) newE.scrollTop = editScrollTop;
                if (newBulk && bulkScrollTop > 0) newBulk.scrollTop = bulkScrollTop;
            });
        }

        window.openEditModal = (photoId) => {
            // 安全升級：改用白名單審核，只有這三種角色可以打開編輯面板
            if (state.user?.role !== 'admin' && state.user?.role !== 'senior_editor' && state.user?.role !== 'editor') { 
                alert("權限不足：您只能上傳照片，無法修改標籤。"); 
                return; 
            }
            const photo = state.photos.find(p => p.id === photoId);
            if (photo) { 
                let cText = photo.customText !== undefined ? photo.customText : '';
                if (photo.customText === undefined && photo.title) {
                     const contentTags = Array.isArray(photo.content) ? photo.content : (photo.content ? [photo.content] : []);
                     const tags = [photo.locationCity, photo.locationDist, photo.year, photo.yearEdition, ...contentTags, photo.issue, photo.remarks].filter(Boolean);
                     const prefix = tags.join('-');
                     if (photo.title.startsWith(prefix + '-')) cText = photo.title.replace(prefix + '-', '');
                     else if (photo.title !== prefix) cText = photo.title; 
                }
                state.editModal = { isOpen: true, photo: { ...photo, customText: cText } }; 
                updateModals(); 
            }
        };
        
        window.closeEditModal = () => { state.editModal = { isOpen: false, photo: null }; updateModals(); };
        
        // 單獨照片刪除 (自動切換成批次刪除的一員)
        window.handleSingleDelete = (id) => {
            state.selectedIds.clear();
            state.selectedIds.add(id);
            window.closeEditModal();
            window.handleBatchDelete();
        };

        window.updateEditModalCustomText = (val) => { if (state.editModal.photo) state.editModal.photo.customText = val; };
        
        window.updateEditModalField = (field, value) => {
            if (state.editModal.photo) {
                if (field === 'content') {
                    if (!Array.isArray(state.editModal.photo.content)) state.editModal.photo.content = state.editModal.photo.content ? [state.editModal.photo.content] : [];
                    if (state.editModal.photo.content.includes(value)) state.editModal.photo.content = state.editModal.photo.content.filter(x => x !== value);
                    else state.editModal.photo.content.push(value);
                } else {
                    state.editModal.photo[field] = value;
                    if(field === 'locationCity' && state.editModal.photo.locationDist) state.editModal.photo.locationDist = '';
                    if(field === 'year' && state.editModal.photo.yearEdition) state.editModal.photo.yearEdition = '';
                }
                
                const formEl = document.getElementById('edit-photo-form');
                if (formEl) {
                    formEl.innerHTML = renderEditModalForm(state.editModal.photo);
                    lucide.createIcons({ root: formEl });
                }
            }
        };

        window.savePhotoEdit = async () => {
            if (!state.user || !state.editModal.photo) return;
            // 雙重防護：送出儲存前再次驗證白名單
            if (state.user?.role !== 'admin' && state.user?.role !== 'senior_editor' && state.user?.role !== 'editor') { 
                alert("權限不足：無法儲存變更。"); 
                return; 
            }
            const photo = state.editModal.photo;
            const contentTags = Array.isArray(photo.content) ? photo.content : (photo.content ? [photo.content] : []);
            const tags = [photo.locationCity, photo.locationDist, photo.year, photo.yearEdition, ...contentTags, photo.issue, photo.remarks].filter(Boolean);
            const finalTitle = [...tags, photo.customText || ''].filter(Boolean).join('-') || '未命名圖片';
            
            const updatedFields = {
                title: finalTitle, customText: photo.customText || '', content: contentTags, 
                year: photo.year || '', yearEdition: photo.yearEdition || '', issue: photo.issue || '', remarks: photo.remarks || '', 
                locationCity: photo.locationCity || '', locationDist: photo.locationDist || ''
            };

            try {
                if (photo._isBatch) {
                    const batchRef = doc(db, 'artifacts', appId, 'public', 'data', 'photo_batches', photo.batchId);
                    await runTransaction(db, async (transaction) => {
                        const batchDoc = await transaction.get(batchRef);
                        if (!batchDoc.exists()) throw "文件遺失";
                        const items = batchDoc.data().items || [];
                        const itemIndex = items.findIndex(i => i.id === photo.id);
                        if (itemIndex > -1) { items[itemIndex] = { ...items[itemIndex], ...updatedFields }; transaction.update(batchRef, { items }); }
                    });
                } else {
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'photos', photo.id), updatedFields, { merge: true });
                }
                window.closeEditModal();
                
                const localIndex = state.photos.findIndex(p => p.id === photo.id);
                if(localIndex > -1) state.photos[localIndex] = { ...state.photos[localIndex], ...updatedFields };
                
                updateGallery(); updateMoodBoard(); 
            } catch (err) { console.error(err); alert("儲存失敗"); }
        };

        window.openBulkEditModal = () => {
            // 安全升級：改用白名單審核，只有這三種角色可以打開批次編輯面板
            if (state.user?.role !== 'admin' && state.user?.role !== 'senior_editor' && state.user?.role !== 'editor') { 
                alert("權限不足：您無法批次修改標籤。"); 
                return; 
            }
            state.bulkEdit = { isOpen: true, data: { content: null, year: null, yearEdition: null, issue: null, remarks: null, locationCity: null, locationDist: null } };
            updateModals();
        };

        window.closeBulkEditModal = () => { state.bulkEdit.isOpen = false; updateModals(); };

        window.updateBulkEditField = (field, value) => {
            if (field === 'content') {
                if (state.bulkEdit.data.content === null) state.bulkEdit.data.content = [];
                if (value === '') return; 
                if (state.bulkEdit.data.content.includes(value)) {
                    state.bulkEdit.data.content = state.bulkEdit.data.content.filter(x => x !== value);
                    if (state.bulkEdit.data.content.length === 0) state.bulkEdit.data.content = null; 
                } else { state.bulkEdit.data.content.push(value); }
            } else {
                if (value === '') { state.bulkEdit.data[field] = null; } else { state.bulkEdit.data[field] = value; }
                if (field === 'locationCity' && state.bulkEdit.data.locationDist !== null) state.bulkEdit.data.locationDist = null;
                if (field === 'year' && state.bulkEdit.data.yearEdition !== null) state.bulkEdit.data.yearEdition = null;
            }
            
            const formEl = document.getElementById('bulk-edit-form');
            if (formEl) { formEl.innerHTML = renderBulkEditModalForm(); lucide.createIcons({ root: formEl }); }
        };

        window.saveBulkEdit = async () => {
            if (!state.user || state.selectedIds.size === 0) return;
            // 雙重防護：送出批次儲存前再次驗證白名單
            if (state.user?.role !== 'admin' && state.user?.role !== 'senior_editor' && state.user?.role !== 'editor') { 
                alert("權限不足：無法儲存變更。"); 
                return; 
            }
            const updates = {};
            Object.keys(state.bulkEdit.data).forEach(key => { if (state.bulkEdit.data[key] !== null) updates[key] = state.bulkEdit.data[key]; });
            if (Object.keys(updates).length === 0) { window.closeBulkEditModal(); return; }

            const btn = document.getElementById('bulk-save-btn');
            if (btn) { btn.disabled = true; btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> 儲存中...'; lucide.createIcons({ root: btn }); }

            try {
                const legacyIds = []; const batchGroups = {};
                state.selectedIds.forEach(id => {
                    const photo = state.photos.find(p => p.id === id);
                    if (photo) {
                        if (photo._isBatch) {
                            if (!batchGroups[photo.batchId]) batchGroups[photo.batchId] = []; batchGroups[photo.batchId].push(photo);
                        } else { legacyIds.push(photo); }
                    }
                });

                const promises = [];
                legacyIds.forEach(photo => {
                    const newPhoto = { ...photo, ...updates };
                    if (updates.content) {
                        const oldContent = Array.isArray(photo.content) ? photo.content : (photo.content ? [photo.content] : []);
                        newPhoto.content = [...new Set([...oldContent, ...updates.content])];
                    }
                    const contentTags = Array.isArray(newPhoto.content) ? newPhoto.content : (newPhoto.content ? [newPhoto.content] : []);
                    const tags = [newPhoto.locationCity, newPhoto.locationDist, newPhoto.year, newPhoto.yearEdition, ...contentTags, newPhoto.issue, newPhoto.remarks].filter(Boolean);
                    newPhoto.title = [...tags, newPhoto.customText || ''].filter(Boolean).join('-') || '未命名圖片';

                    const updatePayload = { ...updates, title: newPhoto.title };
                    if (updates.content) updatePayload.content = newPhoto.content;
                    promises.push(setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'photos', photo.id), updatePayload, { merge: true }));
                    const localIndex = state.photos.findIndex(p => p.id === photo.id);
                    if (localIndex > -1) state.photos[localIndex] = { ...state.photos[localIndex], ...updatePayload };
                });

                Object.keys(batchGroups).forEach(batchId => {
                    const photosToUpdate = batchGroups[batchId];
                    const batchRef = doc(db, 'artifacts', appId, 'public', 'data', 'photo_batches', batchId);
                    promises.push(runTransaction(db, async (transaction) => {
                        const batchDoc = await transaction.get(batchRef);
                        if (batchDoc.exists()) {
                            const items = batchDoc.data().items || []; let changed = false;
                            photosToUpdate.forEach(photo => {
                                const itemIndex = items.findIndex(i => i.id === photo.id);
                                if (itemIndex > -1) {
                                    const newPhoto = { ...items[itemIndex], ...updates };
                                    if (updates.content) {
                                        const oldContent = Array.isArray(items[itemIndex].content) ? items[itemIndex].content : (items[itemIndex].content ? [items[itemIndex].content] : []);
                                        newPhoto.content = [...new Set([...oldContent, ...updates.content])];
                                    }
                                    const contentTags = Array.isArray(newPhoto.content) ? newPhoto.content : (newPhoto.content ? [newPhoto.content] : []);
                                    const tags = [newPhoto.locationCity, newPhoto.locationDist, newPhoto.year, newPhoto.yearEdition, ...contentTags, newPhoto.issue, newPhoto.remarks].filter(Boolean);
                                    newPhoto.title = [...tags, newPhoto.customText || ''].filter(Boolean).join('-') || '未命名圖片';

                                    items[itemIndex] = newPhoto; changed = true;
                                    const localIndex = state.photos.findIndex(p => p.id === photo.id);
                                    if (localIndex > -1) state.photos[localIndex] = { ...state.photos[localIndex], ...newPhoto };
                                }
                            });
                            if (changed) transaction.update(batchRef, { items });
                        }
                    }));
                });
                await Promise.all(promises);
                window.closeBulkEditModal(); state.isSelectionMode = false; state.selectedIds.clear();
                updateGallery(); updateMoodBoard();
            } catch (err) {
                console.error("Batch update error:", err); alert("批次修改發生錯誤");
                if (btn) { btn.disabled = false; btn.innerText = '確認套用變更'; }
            }
        };

        window.updateNewTagValue = (val) => { state.newTagValue = val; };
        
        window.openAddTagModal = (type, parentCity = '') => { 
            if (state.user?.role !== 'admin' && state.user?.role !== 'senior_editor') { 
                alert("權限不足：只有管理員和資深編輯才能新增系統分類標籤。"); 
                return; 
            }
            state.tagModal = { isOpen: true, type, parentCity, error: '' }; state.newTagValue = ''; updateModals(); 
        };
        
        window.closeTagModal = () => { state.tagModal.isOpen = false; updateModals(); };

        window.confirmAddTag = async () => {
            const inputEl = document.getElementById('newTagInput');
            const tag = inputEl ? inputEl.value.trim() : state.newTagValue.trim();
            const { type, parentCity } = state.tagModal;
            if (!tag) { state.tagModal.error = '名稱不可為空'; updateModals(); return; }

            if (type === 'locationCity') {
                if (state.categories.locationHierarchy[tag]) { state.tagModal.error = '此標籤已存在'; updateModals(); return; }
                state.categories.locationHierarchy[tag] = [];
            } else if (type === 'locationDist') {
                if (state.categories.locationHierarchy[parentCity].includes(tag)) { state.tagModal.error = '此標籤已存在'; updateModals(); return; }
                state.categories.locationHierarchy[parentCity].push(tag);
            } else if (type === 'year') {
                if (state.categories.yearHierarchy[tag]) { state.tagModal.error = '此標籤已存在'; updateModals(); return; }
                state.categories.yearHierarchy[tag] = [];
            } else if (type === 'yearEdition') {
                if (state.categories.yearHierarchy[parentCity].includes(tag)) { state.tagModal.error = '此標籤已存在'; updateModals(); return; }
                state.categories.yearHierarchy[parentCity].push(tag);
            } else {
                if (!state.categories[type]) state.categories[type] = [];
                if (state.categories[type].includes(tag)) { state.tagModal.error = '此標籤已存在'; updateModals(); return; }
                state.categories[type].push(tag);
            }
            if (state.user) await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'tags_v2'), state.categories, { merge: true });
            state.tagModal.isOpen = false; updateModals(); updateFilters();
        };

        window.handleDeleteTag = (type, tagToDelete, e) => {
            if(e) e.stopPropagation();
            if (state.user?.role !== 'admin') { alert("權限不足：只有管理員可以刪除系統分類標籤。"); return; }

            state.confirmDialog = {
                isOpen: true, message: `確定要刪除標籤「${tagToDelete}」？\n(此操作不會影響已標記的照片)`, isPrimary: false,
                action: async () => {
                    if (type === 'locationCity') { delete state.categories.locationHierarchy[tagToDelete]; state.filters.locationCity = state.filters.locationCity.filter(t => t !== tagToDelete);
                    } else if (type === 'locationDist') { const [city, dist] = tagToDelete.split('|'); state.categories.locationHierarchy[city] = state.categories.locationHierarchy[city].filter(t => t !== dist); state.filters.locationDist = state.filters.locationDist.filter(t => t !== tagToDelete);
                    } else if (type === 'year') { delete state.categories.yearHierarchy[tagToDelete]; state.filters.year = state.filters.year.filter(t => t !== tagToDelete);
                    } else if (type === 'yearEdition') { const [y, ed] = tagToDelete.split('|'); state.categories.yearHierarchy[y] = state.categories.yearHierarchy[y].filter(t => t !== ed); state.filters.yearEdition = state.filters.yearEdition.filter(t => t !== tagToDelete);
                    } else { state.categories[type] = state.categories[type].filter(t => t !== tagToDelete); state.filters[type] = state.filters[type].filter(t => t !== tagToDelete); }
                    if (state.user) await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'tags_v2'), state.categories, { merge: true });
                    window.closeConfirmDialog(); updateFilters(); updateGallery();
                }
            }; updateModals();
        };

        window.closeConfirmDialog = () => { state.confirmDialog = { isOpen: false, message: '', action: null, isPrimary: false, isLoading: false }; updateModals(); };
        window.executeConfirmAction = () => { if (state.confirmDialog.action) state.confirmDialog.action(); };

        const compressImage = (file) => new Promise((res, rej) => {
            const r = new FileReader(); r.readAsDataURL(file);
            r.onload = e => { const i = new Image(); i.src = e.target.result;
                i.onload = () => {
                    const cvs = document.createElement('canvas'); let w = i.width, h = i.height;
                    if (w > h && w > 800) { h *= 800/w; w = 800; } else if (h > 800) { w *= 800/h; h = 800; }
                    cvs.width = w; cvs.height = h; cvs.getContext('2d').drawImage(i, 0, 0, w, h);
                    res(cvs.toDataURL('image/jpeg', 0.7));
                }; i.onerror = rej;
            }; r.onerror = rej;
        });

        async function analyzeImageWithGemini(base64Image, categories, apiKey) {
            const prompt = `請分析照片內容，並從給定選項中選擇分類，回傳 JSON：
            - content: 從 ${JSON.stringify(categories.content)} 中挑選1~3個符合的分類，以陣列回傳，無則回傳空陣列。
            - year: 必須是 ${JSON.stringify(Object.keys(categories.yearHierarchy || {}))} 其中之一，無則留空。
            - yearEdition: 根據所選年份自行判斷適合的語系/刊物，無則留空。
            - issue: 從 ${JSON.stringify(categories.issue)} 中挑選一個，無則留空。
            - remarks: 從 ${JSON.stringify(categories.remarks || [])} 中挑選一個最適合的標籤描述 (如空拍、夜景)，無則留空。
            - locationCity: 必須是 ${JSON.stringify(Object.keys(categories.locationHierarchy))} 其中之一，無則留空。
            - locationDist: 根據所選城市自行判斷適合的區域，無則留空。
            - customText: 10字以內的繁體中文精準短描述。`;
            const pureBase64 = base64Image.split(',')[1];
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`;
            const response = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: [{ parts: [ { text: prompt }, { inlineData: { mimeType: "image/jpeg", data: pureBase64 } } ] }], generationConfig: { responseMimeType: "application/json" } })
            });
            if (!response.ok) throw new Error("API 請求失敗");
            const data = await response.json(); return JSON.parse(data.candidates[0].content.parts[0].text);
        }

        window.handleBatchUpload = async (e) => {
            const files = Array.from(e.target.files); if (files.length === 0) return;
            let apiKey = sessionStorage.getItem('gemini_api_key');
            if (!apiKey) {
                apiKey = prompt("請輸入 Google Gemini API Key (AIza...)：\n(暫存於本次瀏覽，保障隱私)");
                if (!apiKey) { e.target.value = null; return; }
                sessionStorage.setItem('gemini_api_key', apiKey);
            }
            state.isBatchModalOpen = true; state.batchStatus = 'analyzing'; updateModals();

            try {
                state.uploadBatch = await Promise.all(files.map(async (file, i) => ({
                    id: `batch-${Date.now()}-${i}`, url: await compressImage(file), originalName: file.name,
                    suggestions: { customText: 'AI 智慧解析中...', content: [], year: '', yearEdition: '', issue: '', remarks: '', locationCity: '', locationDist: '' }
                }))); updateModals();

                for (let i = 0; i < state.uploadBatch.length; i++) {
                    let item = state.uploadBatch[i];
                    try {
                        const aiResult = await analyzeImageWithGemini(item.url, state.categories, apiKey);
                        item.suggestions = {
                            customText: aiResult.customText || item.originalName.replace(/\.[^/.]+$/, "").substring(0, 10),
                            content: Array.isArray(aiResult.content) ? aiResult.content : (aiResult.content ? [aiResult.content] : []),
                            year: aiResult.year || '', yearEdition: aiResult.yearEdition || '', issue: aiResult.issue || '',
                            remarks: aiResult.remarks || '', locationCity: aiResult.locationCity || '', locationDist: aiResult.locationDist || ''
                        };
                    } catch (err) {
                        item.suggestions = { customText: item.originalName.replace(/\.[^/.]+$/, "").substring(0, 10), content: [], year: '', yearEdition: '', issue: '', remarks: '', locationCity: '', locationDist: '' };
                        if (err.message.toLowerCase().includes('quota') || err.message.toLowerCase().includes('429')) {
                            alert(`🚨 觸發了 Google API 的限流保護！\n剩下的照片將暫時跳過 AI 解析，您可直接手動確認。`);
                            for (let j = i + 1; j < state.uploadBatch.length; j++) state.uploadBatch[j].suggestions.customText = state.uploadBatch[j].originalName.replace(/\.[^/.]+$/, "").substring(0, 10);
                            break; 
                        }
                    }
                    updateModals();
                    if (i < state.uploadBatch.length - 1) await new Promise(resolve => setTimeout(resolve, 2000));
                }
                state.batchStatus = 'review'; updateModals();
            } catch (err) { alert("批次處理異常: " + err.message); state.batchStatus = 'idle'; state.isBatchModalOpen = false; updateModals(); } 
            e.target.value = null;
        };

        window.updateBatchItemCustomText = (id, val) => { const i = state.uploadBatch.find(x=>x.id===id); if(i) i.suggestions.customText = val; };
        
        window.updateBatchItem = (id, fld, val) => { 
            const i = state.uploadBatch.find(x=>x.id===id); 
            if(i) { 
                if (fld === 'content') {
                    if (!Array.isArray(i.suggestions.content)) i.suggestions.content = i.suggestions.content ? [i.suggestions.content] : [];
                    if (i.suggestions.content.includes(val)) i.suggestions.content = i.suggestions.content.filter(x => x !== val);
                    else i.suggestions.content.push(val);
                } else {
                    i.suggestions[fld] = val; 
                    if(fld === 'locationCity' && i.suggestions.locationDist) i.suggestions.locationDist = ''; 
                    if(fld === 'year' && i.suggestions.yearEdition) i.suggestions.yearEdition = ''; 
                }
                
                const formEl = document.getElementById(`batch-item-form-${id}`);
                if (formEl) { formEl.innerHTML = renderBatchItemForm(i); lucide.createIcons({ root: formEl }); }
            } 
        };
        
        window.removeBatchItem = (id) => { 
            state.confirmDialog = {
                isOpen: true,
                message: '確定要從本次 AI 上傳清單中移除這張照片嗎？',
                isPrimary: false,
                action: () => {
                    state.uploadBatch = state.uploadBatch.filter(i=>i.id!==id); 
                    if(!state.uploadBatch.length) window.closeBatchModal(); else updateModals(); 
                    window.closeConfirmDialog();
                }
            };
            updateModals();
        };
        
        window.closeBatchModal = () => { state.isBatchModalOpen = false; updateModals(); setTimeout(()=>{state.batchStatus='idle';state.uploadBatch=[];}, 300); };

        window.handleSaveBatch = async () => {
            if (!state.user) return; 
            state.batchStatus = 'saving'; updateModals();
            
            try {
                const itemsToSave = [];
                for (let item of state.uploadBatch) {
                    const s = item.suggestions;
                    const contentTags = Array.isArray(s.content) ? s.content : (s.content ? [s.content] : []);
                    const tags = [s.locationCity, s.locationDist, s.year, s.yearEdition, ...contentTags, s.issue, s.remarks].filter(Boolean);
                    let finalTitle = [...tags, s.customText || ''].filter(Boolean).join('-');
                    
                    let storageUrl = item.url;
                    if (storageUrl.startsWith('data:image')) {
                        try {
                            const fileName = `photos/upload_${Date.now()}_${Math.random().toString(36).substring(2,7)}.jpg`;
                            const imageRef = ref(storage, fileName);
                            await uploadString(imageRef, item.url, 'data_url');
                            storageUrl = await getDownloadURL(imageRef); 
                        } catch (storageErr) {
                            console.error("Storage 儲存失敗, 退回 Base64", storageErr);
                        }
                    }
                    
                    itemsToSave.push({ 
                        id: 'p_' + Date.now().toString(36) + Math.random().toString(36).substring(2, 7), 
                        url: storageUrl, 
                        title: finalTitle || '未命名', 
                        customText: s.customText || '', 
                        content: contentTags, 
                        year: s.year || '', yearEdition: s.yearEdition || '', 
                        issue: s.issue || '', remarks: s.remarks || '', 
                        locationCity: s.locationCity || '', locationDist: s.locationDist || '', 
                        createdAt: Date.now() 
                    });
                }
                
                const { addDoc, collection } = await import('https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js');
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'photo_batches'), { items: itemsToSave, createdAt: Date.now() });
                
                window.closeBatchModal(); 
                window.loadPhotos(); 
                
            } catch (e) { 
                console.error(e); 
                state.batchStatus = 'review'; 
                updateModals(); 
                alert("寫入資料庫失敗，請確認 Firebase 設定。"); 
            }
        };

        lucide.createIcons(); 
    </script>
</body>
