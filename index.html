<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelLens 旅遊視覺資產管理 (美學優化與批次管理版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        @keyframes scan { 0% { transform: translateY(0); } 100% { transform: translateY(120px); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes popIn { 0% { opacity: 0; transform: scale(0.95); } 100% { opacity: 1; transform: scale(1); } }
        
        .animate-fadeIn { animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-popIn { animation: popIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .scan-line { animation: scan 1.5s ease-in-out infinite alternate; }
        
        /* 優化捲軸樣式，使其更隱形現代 */
        .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* 隱藏原生 details 的箭頭 */
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased selection:bg-blue-200 selection:text-blue-900">

    <!-- === STREAMING_CHUNK:Building the Login Screen... === -->
    <div id="login-screen" class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/40 backdrop-blur-lg transition-opacity duration-500 px-4">
        <div class="bg-white/90 backdrop-blur-xl rounded-3xl p-8 w-full max-w-sm shadow-2xl transform transition-all animate-popIn text-center border border-white/40">
            <div class="w-20 h-20 bg-gradient-to-br from-blue-100 to-indigo-100 rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-inner transform rotate-3">
                <i data-lucide="camera" class="w-10 h-10 text-blue-600 transform -rotate-3"></i>
            </div>
            <h2 class="text-3xl font-extrabold tracking-tight text-slate-900 mb-2">TravelLens</h2>
            <p class="text-sm text-slate-500 mb-8 font-medium">旅遊視覺資產管理系統</p>
            <form onsubmit="window.handleLogin(event)">
                <div class="space-y-4 mb-6">
                    <input type="email" id="email-input" placeholder="登入信箱 (Email)" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:bg-white outline-none transition-all text-center tracking-wider font-medium placeholder-slate-400 shadow-sm" required autofocus />
                    <input type="password" id="password-input" placeholder="密碼 (Password)" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:bg-white outline-none transition-all text-center tracking-widest font-medium placeholder-slate-400 shadow-sm" required />
                </div>
                <p id="login-error" class="text-red-500 text-xs mb-4 font-semibold bg-red-50 py-2 rounded-lg hidden">帳號或密碼錯誤，請再試一次</p>
                <button type="submit" id="login-btn" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-xl px-4 py-3.5 font-bold hover:from-blue-700 hover:to-indigo-700 transition-all shadow-lg hover:shadow-blue-500/30 flex justify-center items-center gap-2 transform active:scale-[0.98]">
                    進入系統 <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- === STREAMING_CHUNK:Laying out the Main Application Grid... === -->
    <div class="flex flex-col md:flex-row h-screen relative hidden overflow-hidden" id="app">
        
        <!-- 1. 左側過濾面板 -->
        <aside class="w-full md:w-72 bg-white border-r border-slate-200 flex flex-col h-full shrink-0 z-20 shadow-[4px_0_24px_-12px_rgba(0,0,0,0.1)] relative">
            <div class="p-6 border-b border-slate-100 shrink-0 bg-white/80 backdrop-blur-md">
                <h1 class="text-2xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-600 flex items-center gap-2 mb-1">
                    <i data-lucide="aperture" class="text-blue-600 w-6 h-6"></i> TravelLens
                </h1>
                <div id="auth-status" class="mt-2 text-[11px] font-semibold tracking-wider"></div>
            </div>
            
            <div class="p-5 flex-1 overflow-y-auto custom-scrollbar">
                <div class="relative mb-8 group">
                    <input type="text" id="searchInput" placeholder="搜尋關鍵字..." class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:bg-white focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 outline-none transition-all font-medium placeholder-slate-400 group-hover:border-blue-300" />
                    <i data-lucide="search" class="absolute left-3.5 top-3 text-slate-400 w-4 h-4 group-hover:text-blue-500 transition-colors"></i>
                </div>
                <div id="filters-container" class="space-y-6"></div>
            </div>
        </aside>

        <!-- 2. 中央照片網格與頂部工具列 -->
        <main class="w-full md:flex-1 flex flex-col h-full z-10 bg-slate-50/50 shrink-0 min-w-0">
            <!-- 頂部動態工具列 -->
            <header class="h-16 bg-white/70 backdrop-blur-lg border-b border-slate-200 flex items-center justify-between px-6 shrink-0 z-20 shadow-sm sticky top-0">
                <div id="gallery-stats" class="flex items-center gap-2 text-sm font-semibold text-slate-500 bg-white px-3 py-1.5 rounded-lg border border-slate-200 shadow-sm"></div>
                <div id="header-actions" class="flex items-center gap-3">
                    <!-- 動態渲染工具列按鈕 -->
                </div>
            </header>
            
            <!-- 畫廊本體 -->
            <div id="gallery-container" class="flex-1 overflow-y-auto p-6 custom-scrollbar relative"></div>
        </main>

        <!-- 3. 右側企劃板 -->
        <aside class="w-full md:w-80 bg-white border-l border-slate-200 flex flex-col h-full z-20 shadow-[-4px_0_24px_-12px_rgba(0,0,0,0.1)] shrink-0">
            <div class="p-6 border-b border-slate-100 bg-white shrink-0">
                <h2 class="text-lg font-bold text-slate-900 flex items-center justify-between mb-4">
                    專案排版夾
                    <span id="moodboard-count" class="bg-blue-50 text-blue-700 text-xs font-bold py-1 px-2.5 rounded-lg border border-blue-100">0 張</span>
                </h2>
                <div class="flex gap-3" id="project-export-settings"></div>
            </div>
            
            <div id="moodboard-items" class="flex-1 overflow-y-auto p-5 space-y-4 custom-scrollbar bg-slate-50/30"></div>
            
            <div class="p-5 border-t border-slate-100 bg-white shrink-0">
                <button id="exportBtn" onclick="window.handleExport()" disabled class="w-full py-3 rounded-xl text-sm font-bold transition-all bg-slate-100 text-slate-400 cursor-not-allowed">
                    打包下載 (ZIP)
                </button>
            </div>
        </aside>
    </div>

    <!-- Modals Container -->
    <div id="modals-container"></div>

    <!-- === STREAMING_CHUNK:Initializing Firebase and Core State... === -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, onSnapshot, doc, setDoc, getDocs, query, orderBy, runTransaction, limit, deleteDoc } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

        const firebaseConfig = typeof __firebase_config !== 'undefined' && __firebase_config ? JSON.parse(__firebase_config) : {
            apiKey: "AIzaSyAfB6THM5bJNd5wsBwpabMCkEak80xcMrc",
            authDomain: "photo-ed222.firebaseapp.com",
            projectId: "photo-ed222",
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = initializeFirestore(app, {
            localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
        });
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'travel-lens-prod';

        const state = {
            user: null,
            photos: [], 
            displayLimit: 30,
            categories: {
                content: ['景點與娛樂', '餐飲與美食', '住宿與交通', '自然與人文'], 
                year: ['2026', '2027', '2028'],
                issue: ['Vol.12', 'Vol.13', 'Vol.14'],
                locationHierarchy: {
                    '台灣-花蓮': ['花蓮市', '吉安鄉', '秀林鄉'],
                    '台灣-墾丁': ['恆春鎮'],
                    '日本-東京': ['新宿區', '澀谷區'],
                    '日本-北海道': [],
                    '法國-巴黎': []
                }
            },
            searchQuery: '',
            filters: { content: [], year: [], issue: [], locationCity: [], locationDist: [] },
            moodBoard: [],
            
            // 多選批次刪除狀態
            isSelectionMode: false,
            selectedIds: new Set(),
            
            isLoading: true,
            isBatchModalOpen: false,
            batchStatus: 'idle',
            uploadBatch: [],
            tagModal: { isOpen: false, type: '', error: '', parentCity: '' },
            newTagValue: '',
            confirmDialog: { isOpen: false, message: '', action: null, isLoading: false },
            editModal: { isOpen: false, photo: null }
        };

        let unsubTags = null;
        let loadMoreObserver = null;
        let searchTimeout = null;

        // 補上這兩個核心的 UI 畫面更新函數
        function updateGallery() { renderGallery(); }
        function updateMoodBoard() { renderMoodBoard(); }

        // === STREAMING_CHUNK:Authentication and Initial Data Load... ===
        window.handleLogin = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email-input').value;
            const pwd = document.getElementById('password-input').value;
            const btn = document.getElementById('login-btn');
            const errorEl = document.getElementById('login-error');
            
            btn.disabled = true;
            btn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> 驗證中...';
            errorEl.classList.add('hidden');
            lucide.createIcons();

            try {
                const userCred = await signInWithEmailAndPassword(auth, email, pwd);
                localStorage.setItem('travelLensUid', userCred.user.uid);
                document.getElementById('login-screen').classList.add('hidden'); 
                document.getElementById('app').classList.remove('hidden');
                initApp(); 
            } catch (error) {
                errorEl.innerText = '帳號或密碼錯誤，請檢查後再試一次';
                errorEl.classList.remove('hidden');
                document.getElementById('password-input').value = ''; document.getElementById('password-input').focus();
                btn.disabled = false; btn.innerHTML = '進入系統 <i data-lucide="arrow-right" class="w-4 h-4"></i>';
                lucide.createIcons();
            }
        };

        async function initApp() {
            state.user = { uid: auth.currentUser?.uid || localStorage.getItem('travelLensUid') }; 
            renderAuthStatus();
            
            try {
                const tagsRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'tags_v2');
                unsubTags = onSnapshot(tagsRef, (docSnap) => {
                    if (docSnap.exists()) { 
                        state.categories = { ...state.categories, ...docSnap.data() }; 
                        updateFilters(); 
                        updateModals(); 
                    }
                });
                window.loadPhotos();
            } catch (err) { console.error("Init Error:", err); }
        }

        window.loadPhotos = async () => {
            if (!state.user) return;
            state.isLoading = true;
            updateGallery();

            try {
                let batchPhotos = []; let legacyPhotos = [];
                // 1. 讀取批次陣列 (巨量資料最佳化)
                const batchRef = collection(db, 'artifacts', appId, 'public', 'data', 'photo_batches');
                const batchSnap = await getDocs(batchRef);
                batchSnap.forEach(docSnap => {
                    const data = docSnap.data();
                    if (data.items && Array.isArray(data.items)) {
                        data.items.forEach(item => batchPhotos.push({ ...item, batchId: docSnap.id, _isBatch: true }));
                    }
                });
                // 2. 讀取舊單張 (防爆限制)
                const legacyRef = collection(db, 'artifacts', appId, 'public', 'data', 'photos');
                const oldSnap = await getDocs(query(legacyRef, orderBy('createdAt', 'desc'), limit(1000)));
                oldSnap.forEach(docSnap => legacyPhotos.push({ id: docSnap.id, ...docSnap.data(), _isBatch: false }));

                state.photos = [...batchPhotos, ...legacyPhotos].sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            } catch (error) {
                console.error("Load photos error:", error);
                // 加入讀取失敗的 UI 提示，方便未來除錯
                const container = document.getElementById('gallery-container');
                if (container) {
                    container.innerHTML = `<div class="h-full flex flex-col items-center justify-center text-rose-500 py-10 animate-fadeIn"><i data-lucide="shield-alert" class="w-12 h-12 mb-4"></i><p class="font-bold">讀取圖庫失敗，請檢查資料庫權限或網路連線</p><p class="text-xs mt-2 opacity-80">${error.message}</p></div>`;
                    lucide.createIcons({ root: container });
                }
            } finally {
                state.isLoading = false;
                updateGallery();
                updateMoodBoard();
            }
        };

        function renderAuthStatus() {
            const el = document.getElementById('auth-status'); 
            if (state.user) el.innerHTML = `<span class="flex items-center text-emerald-600 uppercase"><div class="w-1.5 h-1.5 bg-emerald-500 rounded-full mr-1.5 animate-pulse"></div> 雲端已連線</span>`;
            else el.innerHTML = `<span class="flex items-center text-rose-500 uppercase"><div class="w-1.5 h-1.5 bg-rose-500 rounded-full mr-1.5"></div> 連線中...</span>`;
        }

        // === STREAMING_CHUNK:Rendering Smart Filters (Zero Flash)... ===
        function updateFilters() {
            // 為了不讓使用者點擊分類時捲軸亂跳，先記錄目前的開啟狀態與捲軸位置
            const detailsStates = {};
            document.querySelectorAll('details.loc-group').forEach(el => {
                if (el.dataset.city) detailsStates[el.dataset.city] = el.open;
            });
            const container = document.getElementById('filters-container');
            if(!container) return;
            const scrollTop = container.scrollTop;

            let html = '';
            html += renderFilterSection('content', '內容與體驗', 'bookmark', 'blue', state.categories.content);
            html += renderFilterSection('year', '發行年份', 'calendar', 'indigo', state.categories.year);
            html += renderFilterSection('issue', '雜誌期數', 'book-open', 'violet', state.categories.issue);
            
            // 地理位置巢狀渲染
            html += `
            <div class="mb-2">
                <h3 class="text-[11px] font-bold tracking-widest text-slate-400 mb-3 flex items-center justify-between uppercase">
                    <div class="flex items-center gap-1.5"><i data-lucide="map-pin" class="w-3.5 h-3.5"></i> 地理位置</div>
                    <button onclick="window.openAddTagModal('locationCity')" class="text-slate-400 hover:text-emerald-600 bg-slate-100 hover:bg-emerald-50 p-1 rounded-md transition-colors" title="新增國家/縣市"><i data-lucide="plus" class="w-3 h-3"></i></button>
                </h3>
            `;
            
            Object.keys(state.categories.locationHierarchy).forEach(city => {
                const dists = state.categories.locationHierarchy[city];
                const isCityChecked = state.filters.locationCity.includes(city);
                const isOpen = detailsStates[city] ? 'open' : '';
                
                html += `
                <details class="loc-group mb-1 group/details" data-city="${city}" ${isOpen}>
                    <summary class="flex items-center justify-between cursor-pointer py-1.5 px-2 hover:bg-slate-100/70 rounded-lg select-none transition-colors">
                        <div class="flex items-center gap-2 flex-1 min-w-0">
                            <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-slate-400 transition-transform group-open/details:rotate-90 shrink-0"></i>
                            <label class="flex items-center space-x-2.5 cursor-pointer flex-1 min-w-0" onclick="event.stopPropagation(); window.toggleFilter('locationCity', '${city}')">
                                <div class="w-4 h-4 rounded border flex items-center justify-center transition-all duration-200 shrink-0 ${isCityChecked ? 'bg-emerald-500 border-emerald-500 shadow-sm shadow-emerald-500/20' : 'border-slate-300 hover:border-emerald-400 bg-white'}">
                                    ${isCityChecked ? '<i data-lucide="check" class="text-white w-3 h-3"></i>' : ''}
                                </div>
                                <span class="text-sm font-semibold truncate ${isCityChecked ? 'text-slate-900' : 'text-slate-600'}">${city}</span>
                            </label>
                        </div>
                        <div class="flex items-center gap-1 opacity-0 group-hover/details:opacity-100 shrink-0">
                            <button onclick="event.preventDefault(); window.openAddTagModal('locationDist', '${city}')" class="text-slate-400 hover:text-emerald-600 p-1 rounded hover:bg-emerald-50" title="在此新增鄉鎮區"><i data-lucide="plus" class="w-3.5 h-3.5"></i></button>
                            <button onclick="event.preventDefault(); window.handleDeleteTag('locationCity', '${city}')" class="text-slate-400 hover:text-rose-500 p-1 rounded hover:bg-rose-50" title="刪除"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                        </div>
                    </summary>
                    <div class="pl-8 mt-1 space-y-1 mb-3 relative before:absolute before:left-4 before:top-0 before:bottom-2 before:w-px before:bg-slate-200">
                `;
                
                if (dists.length === 0) {
                    html += `<p class="text-[11px] text-slate-400 font-medium py-1">無子區域</p>`;
                } else {
                    dists.forEach(dist => {
                        const isDistChecked = state.filters.locationDist.includes(`${city}|${dist}`);
                        html += `
                        <div class="flex items-center justify-between group py-1 pr-2">
                            <label class="flex items-center space-x-2.5 cursor-pointer flex-1 min-w-0" onclick="event.preventDefault(); window.toggleFilter('locationDist', '${city}|${dist}')">
                                <div class="w-3.5 h-3.5 rounded border flex items-center justify-center transition-all duration-200 shrink-0 ${isDistChecked ? 'bg-emerald-500 border-emerald-500 shadow-sm' : 'border-slate-300 hover:border-emerald-400 bg-white'}">
                                    ${isDistChecked ? '<i data-lucide="check" class="text-white w-2.5 h-2.5"></i>' : ''}
                                </div>
                                <span class="text-sm font-medium truncate ${isDistChecked ? 'text-slate-900' : 'text-slate-500'}">${dist}</span>
                            </label>
                            <button onclick="window.handleDeleteTag('locationDist', '${city}|${dist}', event)" class="text-slate-300 hover:text-rose-500 opacity-0 group-hover:opacity-100 p-1 rounded hover:bg-rose-50"><i data-lucide="x" class="w-3 h-3"></i></button>
                        </div>`;
                    });
                }
                html += `</div></details>`;
            });
            html += `</div>`;
            
            container.innerHTML = html;
            lucide.createIcons();
            
            // 恢復滾動位置，防止畫面跳動
            requestAnimationFrame(() => { container.scrollTop = scrollTop; });
        }

        function renderFilterSection(id, title, icon, color, options) {
            let html = `
            <div class="mb-6">
                <h3 class="text-[11px] font-bold tracking-widest text-slate-400 mb-3 flex items-center justify-between uppercase">
                    <div class="flex items-center gap-1.5"><i data-lucide="${icon}" class="w-3.5 h-3.5"></i> ${title}</div>
                    <button onclick="window.openAddTagModal('${id}')" class="text-slate-400 hover:text-${color}-600 bg-slate-100 hover:bg-${color}-50 p-1 rounded-md transition-colors" title="新增標籤"><i data-lucide="plus" class="w-3 h-3"></i></button>
                </h3>
            `;
            (options || []).forEach(cat => {
                const isChecked = state.filters[id].includes(cat);
                html += `
                <div class="flex items-center justify-between group mb-1 px-2 py-1.5 rounded-lg hover:bg-slate-100/70 transition-colors">
                    <label class="flex items-center space-x-2.5 cursor-pointer flex-1 min-w-0" onclick="event.preventDefault(); window.toggleFilter('${id}', '${cat}')">
                        <div class="w-4 h-4 rounded border flex items-center justify-center transition-all duration-200 shrink-0 ${isChecked ? `bg-${color}-500 border-${color}-500 shadow-sm shadow-${color}-500/20` : `border-slate-300 group-hover:border-${color}-400 bg-white`}">
                            ${isChecked ? '<i data-lucide="check" class="text-white w-3 h-3"></i>' : ''}
                        </div>
                        <span class="text-sm font-semibold truncate ${isChecked ? 'text-slate-900' : 'text-slate-600'}">${cat}</span>
                    </label>
                    <button onclick="window.handleDeleteTag('${id}', '${cat}', event)" class="text-slate-300 hover:text-rose-500 opacity-0 group-hover:opacity-100 transition-opacity p-1 rounded hover:bg-rose-50" title="刪除標籤">
                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                    </button>
                </div>`;
            });
            html += `</div>`;
            return html;
        }

        // === STREAMING_CHUNK:Interactive Header & Batch Selection Logic... ===
        function renderHeaderActions() {
            const container = document.getElementById('header-actions');
            if (!container) return;

            if (state.isSelectionMode) {
                container.innerHTML = `
                    <div class="flex items-center bg-blue-50 text-blue-700 px-3.5 py-2 rounded-xl border border-blue-100 mr-2 text-sm font-bold shadow-sm animate-popIn">
                        已選取 ${state.selectedIds.size} 張
                    </div>
                    <button onclick="window.handleBatchDelete()" class="flex items-center gap-2 bg-rose-500 hover:bg-rose-600 text-white px-5 py-2 rounded-xl text-sm font-bold transition-all shadow-md transform active:scale-95 ${state.selectedIds.size === 0 ? 'opacity-50 cursor-not-allowed saturate-0' : ''}" ${state.selectedIds.size === 0 ? 'disabled' : ''}>
                        <i data-lucide="trash-2" class="w-4 h-4"></i> 批次刪除
                    </button>
                    <button onclick="window.toggleSelectionMode()" class="px-5 py-2 text-sm text-slate-600 hover:bg-slate-200 bg-slate-100 rounded-xl font-bold transition-all transform active:scale-95">
                        取消
                    </button>
                `;
            } else {
                container.innerHTML = `
                    <button onclick="window.toggleSelectionMode()" class="flex items-center gap-2 text-sm text-slate-600 hover:text-indigo-600 bg-white border border-slate-200 hover:border-indigo-200 hover:bg-indigo-50 px-4 py-2 rounded-xl transition-all font-bold shadow-sm transform active:scale-95">
                        <i data-lucide="check-square" class="w-4 h-4"></i> 多選模式
                    </button>
                    <button onclick="window.clearFilters()" class="text-sm text-slate-500 hover:text-slate-800 transition-colors font-bold px-3">清除篩選</button>
                    <input type="file" accept="image/*" multiple class="hidden" id="fileInput" onchange="window.handleBatchUpload(event)" />

            lucide.createIcons({ root: container });
        }

        window.toggleSelectionMode = () => {
            state.isSelectionMode = !state.isSelectionMode;
            if (!state.isSelectionMode) state.selectedIds.clear();
            renderHeaderActions();
            updateGallery(); // 需要完全重新渲染卡片狀態
        };

        // 直接 DOM 操作，解決點擊卡片會閃爍的問題
        window.handlePhotoClick = (id) => {
            if (state.isSelectionMode) {
                const card = document.getElementById(`card-${id}`);
                const selIcon = document.getElementById(`sel-icon-${id}`);
                let isSelected = false;

                if (state.selectedIds.has(id)) {
                    state.selectedIds.delete(id);
                } else {
                    state.selectedIds.add(id);
                    isSelected = true;
                }

                // 只更新該卡片的 DOM 樣式，不重新載入圖片
                if (card) {
                    if (isSelected) {
                        card.classList.add('ring-4', 'ring-blue-500', 'shadow-xl', 'scale-[0.98]');
                        card.classList.remove('hover:shadow-xl', 'border-slate-200');
                    } else {
                        card.classList.remove('ring-4', 'ring-blue-500', 'shadow-xl', 'scale-[0.98]');
                        card.classList.add('hover:shadow-xl', 'border-slate-200');
                    }
                }
                if (selIcon) {
                    selIcon.className = isSelected ? 'absolute inset-0 bg-blue-500/10 border-[6px] border-blue-500 rounded-2xl z-20 flex items-start justify-start p-3 transition-all' : 'hidden';
                }
                renderHeaderActions();
            } else {
                window.openEditModal(id);
            }
        };

        // 直接 DOM 操作企劃板加入按鈕，解決點按鈕會閃爍的問題
        window.toggleMoodBoard = (photoId, event) => {
            if (event) event.stopPropagation(); // 防止觸發卡片點擊
            const photo = state.photos.find(p => p.id === photoId) || state.moodBoard.find(p => p.id === photoId);
            if (!photo) return;

            const index = state.moodBoard.findIndex(p => p.id === photoId);
            let isNowSelected = false;

            if (index > -1) {
                state.moodBoard.splice(index, 1);
            } else {
                state.moodBoard.push(photo);
                isNowSelected = true;
            }

            // 直接找到對應的按鈕並變更外觀
            const btn = document.getElementById(`mb-btn-${photoId}`);
            if (btn) {

                    btn.className = 'absolute top-3 right-3 p-2.5 rounded-full shadow-lg z-30 bg-blue-600 text-white hover:bg-blue-700 transition-all transform hover:scale-110';
                    btn.innerHTML = '<i data-lucide="check" class="w-4 h-4"></i>';
                } else {
                    btn.className = 'absolute top-3 right-3 p-2.5 rounded-full shadow-lg z-30 bg-white/90 backdrop-blur text-slate-700 hover:bg-white transition-all transform hover:scale-110';
                    btn.innerHTML = '<i data-lucide="plus" class="w-4 h-4"></i>';

                lucide.createIcons({ root: btn });

            updateMoodBoard(); // 更新右側列表
        };

        // === STREAMING_CHUNK:Rendering Main Gallery Grid... ===
        function renderGallery() {
            renderHeaderActions();
            const container = document.getElementById('gallery-container');
            const stats = document.getElementById('gallery-stats');
            
            const filteredPhotos = state.photos.filter(photo => {

                const matchSearch = (photo.title || '').toLowerCase().includes(searchTxt) || 
                                    (photo.locationCity || '').toLowerCase().includes(searchTxt) ||
                                    (photo.locationDist || '').toLowerCase().includes(searchTxt);
                const matchContent = state.filters.content.length === 0 || state.filters.content.includes(photo.content);
                const matchYear = state.filters.year.length === 0 || state.filters.year.includes(photo.year);
                const matchIssue = state.filters.issue.length === 0 || state.filters.issue.includes(photo.issue);
                
                let matchLocation = true;
                if (state.filters.locationCity.length > 0 || state.filters.locationDist.length > 0) {
                    const cityMatch = state.filters.locationCity.includes(photo.locationCity);
                    const distMatch = state.filters.locationDist.includes(`${photo.locationCity}|${photo.locationDist}`);
                    matchLocation = cityMatch || distMatch;
                }
                return matchSearch && matchContent && matchYear && matchIssue && matchLocation;
            });

            stats.innerHTML = `<i data-lucide="filter" class="w-3.5 h-3.5 text-blue-500"></i> 共 ${state.photos.length} 張 <span class="text-slate-300 mx-1">|</span> 顯示 ${filteredPhotos.length} 張`;

            if (state.isLoading) {
                container.innerHTML = `<div class="h-full flex flex-col items-center justify-center text-slate-400 animate-fadeIn"><i data-lucide="loader-2" class="animate-spin mb-4 text-blue-500 w-10 h-10"></i><p class="font-bold">載入圖庫中...</p></div>`; return;
            }
            if (state.photos.length === 0) {
                container.innerHTML = `<div class="h-full flex flex-col items-center justify-center text-slate-400 py-10 animate-fadeIn"><div class="w-20 h-20 bg-slate-100 rounded-full flex items-center justify-center mb-4"><i data-lucide="image" class="w-10 h-10 text-slate-300"></i></div><p class="mb-2 font-bold text-slate-600">圖庫目前是空的</p><p class="text-sm">點擊右上角批量上傳開始匯入</p></div>`; return;
            }
            if (filteredPhotos.length === 0) {
                 container.innerHTML = `<div class="h-full flex flex-col items-center justify-center text-slate-400 py-10 animate-fadeIn"><i data-lucide="filter-x" class="w-12 h-12 mb-4 text-slate-300"></i><p class="font-bold text-slate-600">沒有符合條件的照片</p></div>`; return;
            }

            const photosToRender = filteredPhotos.slice(0, state.displayLimit);
            let html = `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 pb-10">`;
            
            photosToRender.forEach(photo => {
                const inMoodboard = state.moodBoard.some(p => p.id === photo.id);
                const isSelected = state.selectedIds.has(photo.id);
                const locDisplay = [photo.locationCity, photo.locationDist].filter(Boolean).join(', ');
                
                // 動態決定卡片與圖示的樣式
                const cardBaseClass = "group relative bg-white rounded-2xl overflow-hidden transition-all duration-300 flex flex-col cursor-pointer";
                const cardActiveStyle = isSelected ? "ring-4 ring-blue-500 shadow-xl scale-[0.98]" : "border border-slate-200 hover:shadow-xl";
                
                html += `
                    <div class="${cardBaseClass} ${cardActiveStyle}" onclick="window.handlePhotoClick('${photo.id}')" id="card-${photo.id}">
                        <!-- 選取模式覆蓋層 -->
                        <div id="sel-icon-${photo.id}" class="${isSelected ? 'absolute inset-0 bg-blue-500/10 border-[6px] border-blue-500 rounded-2xl z-20 flex items-start justify-start p-3 transition-all' : 'hidden'}">
                            <div class="bg-blue-500 text-white rounded-full p-1 shadow-md"><i data-lucide="check" class="w-5 h-5"></i></div>
                        </div>

                        <!-- 圖片區塊 -->
                        <div class="relative aspect-[4/3] bg-slate-200 overflow-hidden shrink-0">
                            <img src="${photo.url}" loading="lazy" alt="${photo.title}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" />
                            
                            <!-- 底部漸層，增加文字易讀性 -->
                            <div class="absolute inset-0 bg-gradient-to-t from-slate-900/60 via-transparent to-transparent pointer-events-none z-10"></div>
                            
                            <!-- 企劃板按鈕 (選取模式下隱藏) -->
                            ${!state.isSelectionMode ? `
                                <button id="mb-btn-${photo.id}" onclick="window.toggleMoodBoard('${photo.id}', event)" class="absolute top-3 right-3 p-2.5 rounded-full shadow-lg z-30 transition-all transform hover:scale-110 ${inMoodboard ? 'bg-blue-600 text-white' : 'bg-white/90 backdrop-blur text-slate-700 hover:bg-white'}">
                                    <i data-lucide="${inMoodboard ? 'check' : 'plus'}" class="w-4 h-4"></i>
                                </button>
                                <button onclick="window.handlePhotoClick('${photo.id}')" class="absolute top-3 left-3 p-2.5 rounded-full bg-slate-900/60 text-white shadow-lg backdrop-blur opacity-0 group-hover:opacity-100 z-30 transition-all hover:bg-slate-900 transform hover:scale-110">
                                    <i data-lucide="pencil" class="w-4 h-4"></i>
                                </button>
                            ` : ''}

                            <!-- 圖片底部標籤 -->
                            <div class="absolute bottom-3 left-3 flex gap-1.5 z-20">
                                <span class="px-2 py-1 text-[10px] font-bold tracking-wider uppercase bg-white/20 backdrop-blur-md text-white rounded shadow-sm flex items-center gap-1 border border-white/20">
                                    <i data-lucide="calendar" class="w-3 h-3"></i> ${photo.year || '無年份'} | ${photo.issue || '無期數'}
                                </span>
                            </div>
                        </div>

                        <!-- 文字資訊區塊 -->
                        <div class="p-4 flex-1 flex flex-col bg-white z-10 relative">
                            <h4 class="font-bold text-slate-900 mb-2 truncate text-sm" title="${photo.title}">${photo.customText || photo.title || '未命名'}</h4>
                            <div class="flex flex-wrap gap-1.5 text-[10px] font-semibold text-slate-500 mt-auto">
                                ${photo.content ? `<span class="flex items-center gap-1 bg-slate-100 px-2 py-1 rounded text-slate-600"><i data-lucide="bookmark" class="w-3 h-3"></i> ${photo.content}</span>` : ''}
                                ${locDisplay ? `<span class="flex items-center gap-1 bg-emerald-50 text-emerald-700 px-2 py-1 rounded border border-emerald-100"><i data-lucide="map-pin" class="w-3 h-3"></i> ${locDisplay}</span>` : ''}
                            </div>
                        </div>
                    </div>`;
            });
            html += `</div>`;

            if (state.displayLimit < filteredPhotos.length) {
                html += `<div id="load-more-sentinel" class="w-full py-8 flex justify-center text-slate-400"><i data-lucide="loader-2" class="w-6 h-6 animate-spin text-blue-500"></i></div>`;
            }

            container.innerHTML = html;
            lucide.createIcons({ root: container });
            setupScrollObserver();
        }

        function setupScrollObserver() {
            if (loadMoreObserver) loadMoreObserver.disconnect();
            const sentinel = document.getElementById('load-more-sentinel');
            if (!sentinel) return;

            loadMoreObserver = new IntersectionObserver((entries) => {
                if (entries[0].isIntersecting) { state.displayLimit += 30; updateGallery(); }
            }, { root: document.getElementById('gallery-container'), rootMargin: '200px' });
            loadMoreObserver.observe(sentinel);
        }

        document.getElementById('searchInput').addEventListener('input', (e) => { 
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                state.searchQuery = e.target.value; state.displayLimit = 30; 
                document.getElementById('gallery-container').scrollTop = 0; updateGallery(); 
            }, 250);
        });

        window.toggleFilter = (type, value) => {
            const current = state.filters[type];
            if (current.includes(value)) state.filters[type] = current.filter(item => item !== value);
            else state.filters[type].push(value);
            state.displayLimit = 30; document.getElementById('gallery-container').scrollTop = 0;
            updateFilters(); updateGallery();
        };
        window.clearFilters = () => {
            state.filters = { content: [], year: [], issue: [], locationCity: [], locationDist: [] };
            state.searchQuery = ''; document.getElementById('searchInput').value = '';
            state.displayLimit = 30; document.getElementById('gallery-container').scrollTop = 0;
            updateFilters(); updateGallery();
        };

        // === STREAMING_CHUNK:Batch Deletion Logic... ===
        window.handleBatchDelete = () => {
            if (state.selectedIds.size === 0) return;
            state.confirmDialog = {
                isOpen: true, 
                message: `確定要刪除這 ${state.selectedIds.size} 張照片嗎？\n(此操作無法復原，並將從所有企劃板中移除)`, 
                isPrimary: false,
                action: async () => {
                    // 將狀態切換為 Loading
                    state.confirmDialog.isLoading = true;
                    updateModals();
                    
                    try {
                        const legacyIds = [];
                        const batchGroups = {}; 
                        
                        // 分類照片來源 (獨立文件 vs 批次陣列)
                        state.selectedIds.forEach(id => {
                            const photo = state.photos.find(p => p.id === id);
                            if (photo) {
                                if (photo._isBatch) {
                                    if (!batchGroups[photo.batchId]) batchGroups[photo.batchId] = [];
                                    batchGroups[photo.batchId].push(id);
                                } else {
                                    legacyIds.push(id);
                                }
                            }
                        });

                        const promises = [];
                        // 1. 刪除獨立照片
                        legacyIds.forEach(id => { promises.push(deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'photos', id))); });
                        // 2. 刪除批次陣列中的特定照片 (透過 Transaction 保障陣列安全)
                        Object.keys(batchGroups).forEach(batchId => {
                            const idsToRemove = batchGroups[batchId];
                            const batchRef = doc(db, 'artifacts', appId, 'public', 'data', 'photo_batches', batchId);
                            promises.push(runTransaction(db, async (transaction) => {
                                const batchDoc = await transaction.get(batchRef);
                                if (batchDoc.exists()) {
                                    const items = batchDoc.data().items || [];
                                    const newItems = items.filter(i => !idsToRemove.includes(i.id));
                                    if (newItems.length === 0) transaction.delete(batchRef);
                                    else transaction.update(batchRef, { items: newItems });
                                }
                            }));
                        });

                        await Promise.all(promises);

                        // 更新本地快取，極速反應
                        state.photos = state.photos.filter(p => !state.selectedIds.has(p.id));
                        state.moodBoard = state.moodBoard.filter(p => !state.selectedIds.has(p.id));
                        state.selectedIds.clear();
                        state.isSelectionMode = false;
                        
                        updateGallery(); updateMoodBoard(); window.closeConfirmDialog();
                    } catch (error) {
                        console.error("Batch delete error:", error);
                        alert("批量刪除過程中發生錯誤");
                        window.closeConfirmDialog();
                    }
                }
            };
            updateModals();
        };

        // === STREAMING_CHUNK:Right Sidebar (Moodboard)... ===
        function renderMoodBoard() {

                        <option value="" disabled ${!currentYear ? 'selected' : ''}>選擇</option>

                        <option value="" disabled ${!currentIssue ? 'selected' : ''}>選擇</option>

            if (state.moodBoard.length === 0) {

                        <img src="${photo.url}" class="w-14 h-14 object-cover rounded-lg shadow-sm" />
                        <div class="flex-1 min-w-0 flex flex-col justify-center">

                            <p class="text-[10px] text-slate-500 mt-1 flex items-center gap-1"><i data-lucide="tag" class="w-3 h-3"></i> ${photo.content || '無'}</p>

                container.innerHTML = html;
                btn.disabled = false; btn.innerHTML = '打包為 ZIP 下載'; btn.className = "w-full py-3.5 rounded-xl text-sm font-bold transition-all bg-slate-900 text-white hover:bg-slate-800 shadow-lg hover:shadow-slate-500/30 transform active:scale-[0.98]";

        window.handleExport = () => {
            if (state.moodBoard.length === 0) return;
            const year = document.getElementById('project-year').value || '未定年份';
            const issue = document.getElementById('project-issue').value || '未定期數';
            const zipName = `TravelLens_資源_${year}_${issue}.zip`;

            state.confirmDialog = {
                isOpen: true, message: `確認將企劃板下載為：\n${zipName} 嗎？`, isPrimary: true,
                action: async () => {
                    window.closeConfirmDialog();
                    const exportBtn = document.getElementById('exportBtn'); const origText = exportBtn.innerText;
                    exportBtn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 animate-spin inline mr-2"></i> 打包壓縮中...'; exportBtn.disabled = true;
                    try {
                        const zip = new JSZip();
                        await Promise.all(state.moodBoard.map(async (photo, index) => {
                            try {
                                const response = await fetch(photo.url); const blob = await response.blob();
                                const ext = blob.type.split('/')[1] || 'jpg';
                                const safeTitle = (photo.customText || photo.title || '圖片').replace(/[^a-zA-Z0-9\u4e00-\u9fa5_-]/g, '');
                                zip.file(`${String(index + 1).padStart(3, '0')}_${safeTitle}.${ext}`, blob);
                            } catch (err) { zip.file(`Error_${index + 1}.txt`, `下載阻擋:\n${photo.url}`); }
                        }));
                        const zipBlob = await zip.generateAsync({ type: 'blob' });
                        const link = document.createElement('a'); link.href = URL.createObjectURL(zipBlob); link.download = zipName;
                        document.body.appendChild(link); link.click(); document.body.removeChild(link); URL.revokeObjectURL(link.href);
                        state.moodBoard = []; updateGallery(); updateMoodBoard();
                    } catch (error) { alert('下載發生錯誤'); } 
                    finally { exportBtn.innerText = origText; exportBtn.disabled = false; }
                }
            }; updateModals();
        };

        // === STREAMING_CHUNK:Modals & Utility Functions... ===

            return `<div class="flex flex-wrap gap-1.5 max-h-28 overflow-y-auto custom-scrollbar pr-1 pb-1">
                ${options.map(opt => {
                    const isSel = selectedValue === opt;
                    const safeOpt = opt.replace(/'/g, "\\'");
                    const clickArgs = idOrNull ? `'${idOrNull}', '${field}', '${isSel ? '' : safeOpt}'` : `'${field}', '${isSel ? '' : safeOpt}'`;
                    const activeStyle = colorClassActive + ' font-bold shadow-sm ring-2 ring-current ring-inset';
                    const inactiveStyle = 'bg-slate-50 border-slate-200 text-slate-500 hover:bg-slate-100 hover:text-slate-800 font-semibold';
                    return `<button type="button" onclick="window.${onClickFnName}(${clickArgs})" class="px-2.5 py-1.5 text-xs rounded-lg border transition-all duration-200 ${isSel ? activeStyle : inactiveStyle}">${opt}</button>`;
                }).join('')}
            </div>`;
        }

        const compressImage = (file) => new Promise((res, rej) => {
            const r = new FileReader(); r.readAsDataURL(file);
            r.onload = e => { const i = new Image(); i.src = e.target.result;
                i.onload = () => {
                    const cvs = document.createElement('canvas'); let w = i.width, h = i.height;
                    if (w > h && w > 800) { h *= 800/w; w = 800; } else if (h > 800) { w *= 800/h; h = 800; }
                    cvs.width = w; cvs.height = h; cvs.getContext('2d').drawImage(i, 0, 0, w, h);
                    res(cvs.toDataURL('image/jpeg', 0.7));
                }; i.onerror = rej;
            }; r.onerror = rej;
        });

        async function analyzeImageWithGemini(base64Image, categories, apiKey) {
            const prompt = `請分析照片內容，並從給定選項中選擇分類，回傳 JSON：
            - content: 從 ${JSON.stringify(categories.content)} 中挑選一個，無則留空。
            - year: 從 ${JSON.stringify(categories.year)} 中挑選一個，無則留空。
            - issue: 從 ${JSON.stringify(categories.issue)} 中挑選一個，無則留空。
            - locationCity: 必須是 ${JSON.stringify(Object.keys(categories.locationHierarchy))} 其中之一，無則留空。
            - locationDist: 根據所選城市自行判斷適合的區域，無則留空。
            - customText: 10字以內的繁體中文精準短描述。`;
            const pureBase64 = base64Image.split(',')[1];
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`;
            const response = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: [{ parts: [ { text: prompt }, { inlineData: { mimeType: "image/jpeg", data: pureBase64 } } ] }], generationConfig: { responseMimeType: "application/json" } })
            });
            if (!response.ok) throw new Error("API 請求失敗");
            const data = await response.json(); return JSON.parse(data.candidates[0].content.parts[0].text);
        }

        window.handleBatchUpload = async (e) => {
            const files = Array.from(e.target.files); if (files.length === 0) return;
            let apiKey = sessionStorage.getItem('gemini_api_key');
            if (!apiKey) {
                apiKey = prompt("請輸入 Google Gemini API Key (AIza...)：\n(暫存於本次瀏覽，保障隱私)");
                if (!apiKey) { e.target.value = null; return; }
                sessionStorage.setItem('gemini_api_key', apiKey);
            }
            state.isBatchModalOpen = true; state.batchStatus = 'analyzing'; updateModals();

            try {
                state.uploadBatch = await Promise.all(files.map(async (file, i) => ({
                    id: `batch-${Date.now()}-${i}`, url: await compressImage(file), originalName: file.name,
                    suggestions: { customText: 'AI 智慧解析中...', content: '', year: '', issue: '', locationCity: '', locationDist: '' }
                }))); updateModals();

                for (let i = 0; i < state.uploadBatch.length; i++) {
                    let item = state.uploadBatch[i];
                    try {
                        const aiResult = await analyzeImageWithGemini(item.url, state.categories, apiKey);
                        item.suggestions = {
                            customText: aiResult.customText || item.originalName.replace(/\.[^/.]+$/, "").substring(0, 10),
                            content: aiResult.content || '', year: aiResult.year || '', issue: aiResult.issue || '',
                            locationCity: aiResult.locationCity || '', locationDist: aiResult.locationDist || ''
                        };
                    } catch (err) {
                        item.suggestions = { customText: item.originalName.replace(/\.[^/.]+$/, "").substring(0, 10), content: '', year: '', issue: '', locationCity: '', locationDist: '' };
                        if (err.message.toLowerCase().includes('quota') || err.message.toLowerCase().includes('429')) {
                            alert(`🚨 觸發了 Google API 的限流保護！\n剩下的照片將暫時跳過 AI 解析，您可直接手動確認。`);
                            for (let j = i + 1; j < state.uploadBatch.length; j++) state.uploadBatch[j].suggestions.customText = state.uploadBatch[j].originalName.replace(/\.[^/.]+$/, "").substring(0, 10);
                            break; 
                        }
                    }
                    updateModals();
                    if (i < state.uploadBatch.length - 1) await new Promise(resolve => setTimeout(resolve, 2000));
                }
                state.batchStatus = 'review'; updateModals();
            } catch (err) { alert("批次處理異常: " + err.message); state.batchStatus = 'idle'; state.isBatchModalOpen = false; updateModals(); } 
            e.target.value = null;
        };

        window.updateBatchItemCustomText = (id, val) => { const i = state.uploadBatch.find(x=>x.id===id); if(i) i.suggestions.customText = val; };
        
        // 修改：使用精準 DOM 更新替換該項目的局部表單，不再重繪整個 Modal 避免圖片與滾動條閃爍
        window.updateBatchItem = (id, fld, val) => { 
            const i = state.uploadBatch.find(x=>x.id===id); 
            if(i) { 
                i.suggestions[fld] = val; 
                if(fld === 'locationCity' && i.suggestions.locationDist) i.suggestions.locationDist = ''; 
                
                const formEl = document.getElementById(`batch-item-form-${id}`);
                if (formEl) {
                    formEl.innerHTML = renderBatchItemForm(i);
                    lucide.createIcons({ root: formEl });
                }
            } 
        };
        
        window.removeBatchItem = (id) => { state.uploadBatch = state.uploadBatch.filter(i=>i.id!==id); if(!state.uploadBatch.length) window.closeBatchModal(); else updateModals(); };
        window.closeBatchModal = () => { state.isBatchModalOpen = false; updateModals(); setTimeout(()=>{state.batchStatus='idle';state.uploadBatch=[];}, 300); };

        window.handleSaveBatch = async () => {
            if (!state.user) return; state.batchStatus = 'saving'; updateModals();
            try {
                const itemsToSave = state.uploadBatch.map(item => {
                    const s = item.suggestions;
                    const tags = [s.locationCity, s.locationDist, s.content, s.year, s.issue].filter(Boolean);
                    let finalTitle = [...tags, s.customText || ''].filter(Boolean).join('-');
                    return { id: 'p_' + Date.now().toString(36) + Math.random().toString(36).substring(2, 7), url: item.url, title: finalTitle || '未命名', customText: s.customText || '', content: s.content || '', year: s.year || '', issue: s.issue || '', locationCity: s.locationCity || '', locationDist: s.locationDist || '', createdAt: Date.now() };
                });
                
                // 使用原版 Firestore import
                const { addDoc, collection } = await import('https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js');
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'photo_batches'), { items: itemsToSave, createdAt: Date.now() });
                
                window.closeBatchModal(); window.loadPhotos(); 
            } catch (e) { console.error(e); state.batchStatus = 'review'; updateModals(); alert("儲存失敗"); }
        };

        lucide.createIcons(); 
    </script>
</body>
</html>
